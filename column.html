
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EKDYS — SHIFT COLUMN 3D</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    #shift-scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      isolation: isolate;
    }

    /* Fond de la scène originale */
    #shift-background {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: url("./fond-ekdys.png") center / cover no-repeat;
      pointer-events: none;
    }

    /* Canvas interactif */
    #shift-scene canvas {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      outline: none;
    }

    #shift-scene canvas.dragging {
      cursor: grabbing;
    }

    /* Chargement */
    #shift-loading {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      color: #ddd;
      font: 12px Arial, sans-serif;
      letter-spacing: 2px;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>

<body>

  <div id="shift-scene">
    <div id="shift-background"></div>
    <div id="shift-loading">EKDYS — LOADING</div>
  </div>

  <script type="module">

    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

    /* =========================================
       EKDYS — SHIFT COLUMN 3D

       Rendu repris de la scène principale :
       - Même modèle GLB
       - Même éclairage
       - Même saturation et contraste
       - Même déformation du tissu
       - Même fond

       Particularités de cette fenêtre :
       - Cadrage rapproché
       - Pas de zoom au scroll
       - Rotation au scroll
       - Rotation manuelle souris / tactile
       - Oscillations aux extrémités
    ========================================= */

    const container = document.querySelector("#shift-scene");
    const loading = document.querySelector("#shift-loading");

    /* =========================================
       PARAMÈTRES DE ROTATION
    ========================================= */

    const INITIAL_ROTATION_Y = 0.34;

    // Limites absolues autour de l'orientation initiale
    const MIN_ANGLE_DEG = -25;
    const MAX_ANGLE_DEG = 25;

    // Rotation automatique de la page
    const SCROLL_SMOOTHING = 0.09;

    // Allers-retours aux extrémités
    const BOUNCE_AMPLITUDE_DEG = 6;
    const BOUNCE_CYCLE_MS = 550;

    // Sensibilité de la souris et du doigt
    const MOUSE_DEGREES_PER_PIXEL = 0.25;

    // Caméra fixe : aucun zoom au scroll
    const CAMERA_Z = 15.0;

    // Détection du haut et du bas de la page
    const TOP_THRESHOLD = 0.001;
    const BOTTOM_THRESHOLD = 0.999;

    /* =========================================
       SCÈNE
    ========================================= */

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x080808, 0.002);

    /* =========================================
       CAMÉRA
    ========================================= */

    const camera = new THREE.PerspectiveCamera(
      32,
      container.clientWidth / Math.max(container.clientHeight, 1),
      0.01,
      100
    );

    camera.position.set(0, 0, CAMERA_Z);
    camera.lookAt(0, 0, 0);

    /* =========================================
       RENDERER
    ========================================= */

    const renderer = new THREE.WebGLRenderer({
      alpha: true,
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio || 1, 1.5)
    );

    renderer.setSize(
      container.clientWidth,
      container.clientHeight
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.setClearColor(0x000000, 0);

    // Le canvas reste interactif pour la souris et le doigt
    renderer.domElement.style.pointerEvents = "auto";

    container.appendChild(renderer.domElement);

    const canvas = renderer.domElement;

    /* =========================================
       ÉCLAIRAGE ORIGINAL EKDYS
    ========================================= */

    scene.add(
      new THREE.HemisphereLight(
        0xffffff,
        0x38313a,
        1.8
      )
    );

    const keyLight = new THREE.DirectionalLight(
      0xffffff,
      3.2
    );
    keyLight.position.set(1.5, 4, 4);
    scene.add(keyLight);

    const sideLight = new THREE.DirectionalLight(
      0xe8eaf2,
      1.8
    );
    sideLight.position.set(-4, 1.5, 2);
    scene.add(sideLight);

    const rimLight = new THREE.DirectionalLight(
      0xd43b58,
      1.4
    );
    rimLight.position.set(-3, 1, -3);
    scene.add(rimLight);

    const fillLight = new THREE.DirectionalLight(
      0xffffff,
      1.2
    );
    fillLight.position.set(0, -1, 5);
    scene.add(fillLight);

    const frontLight = new THREE.DirectionalLight(
      0xffffff,
      0.8
    );
    frontLight.position.set(0, 2, 6);
    scene.add(frontLight);

    /* =========================================
       DRACO ET GLTF
    ========================================= */

    const dracoLoader = new DRACOLoader();

    dracoLoader.setDecoderPath(
      "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
    );

    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    /* =========================================
       VARIABLES DU MODÈLE
    ========================================= */

    const clock = new THREE.Clock();

    let shirtPivot = null;
    let shirtModel = null;

    let modelSize = new THREE.Vector3();
    let shirtBaseScale = 1;

    const animatedShaders = [];

    /* =========================================
       VARIABLES DU SCROLL
    ========================================= */

    let scrollTarget = 0;
    let scrollCurrent = 0;

    let initializedScroll = false;
    let lastReceivedProgress = null;

    let hasLeftTop = false;
    let hasLeftBottom = false;

    let pendingBounce = null;
    let bounceState = null;

    // Compteurs indépendants pour chaque extrémité
    let topLimitHits = 0;
    let bottomLimitHits = 0;

    /* =========================================
       VARIABLES DE ROTATION MANUELLE
    ========================================= */

    let mouseOffsetDeg = 0;

    let isDragging = false;
    let activePointerId = null;

    let dragStartX = 0;
    let dragStartAngleDeg = 0;

    /* =========================================
       CADRAGE DU T-SHIRT

       On calcule la largeur réellement visible
       pendant toute la plage de rotation.

       Cela permet d'agrandir le modèle sans
       le couper lorsqu'il pivote.
    ========================================= */

    function getMaximumProjectedWidth() {
      const minYaw =
        INITIAL_ROTATION_Y +
        THREE.MathUtils.degToRad(MIN_ANGLE_DEG);

      const maxYaw =
        INITIAL_ROTATION_Y +
        THREE.MathUtils.degToRad(MAX_ANGLE_DEG);

      let maximumWidth = 0;

      // Échantillonnage de toute la plage de rotation
      const samples = 80;

      for (let i = 0; i <= samples; i++) {
        const progress = i / samples;

        const yaw = THREE.MathUtils.lerp(
          minYaw,
          maxYaw,
          progress
        );

        const projectedWidth =
          Math.abs(Math.cos(yaw)) * modelSize.x +
          Math.abs(Math.sin(yaw)) * modelSize.z;

        maximumWidth = Math.max(
          maximumWidth,
          projectedWidth
        );
      }

      return Math.max(maximumWidth, 0.001);
    }

    function updateShirtFit() {
      if (!shirtPivot || !shirtModel) return;

      if (
        modelSize.y <= 0 ||
        modelSize.x <= 0
      ) {
        return;
      }

      const width = container.clientWidth;
      const height = container.clientHeight;

      if (!width || !height) return;

      const aspect = width / height;

      const visibleHeight =
        2 *
        Math.tan(
          THREE.MathUtils.degToRad(camera.fov / 2)
        ) *
        CAMERA_Z;

      const visibleWidth = visibleHeight * aspect;

      const projectedWidth = getMaximumProjectedWidth();

      /*
        Le modèle utilise presque toute la hauteur
        disponible et toute la largeur nécessaire.

        On conserve une petite marge pour éviter
        que les manches ne soient coupées.
      */

      const heightMargin = 0.98;
      const widthMargin = 0.96;

      const scaleByHeight =
        (visibleHeight * heightMargin) /
        Math.max(modelSize.y, 0.001);

      const scaleByWidth =
        (visibleWidth * widthMargin) /
        projectedWidth;

      shirtBaseScale = Math.min(
        scaleByWidth,
        scaleByHeight
      );

      // Échelle absolue, jamais cumulative
      shirtPivot.scale.setScalar(shirtBaseScale);

      const scaledHeight =
        modelSize.y * shirtBaseScale;

      shirtPivot.position.set(
        0,
        -scaledHeight * 0.02,
        0
      );
    }

    /* =========================================
       CHARGEMENT DU T-SHIRT
    ========================================= */

    loader.load(
      "./shift.glb",

      (gltf) => {
        try {
          shirtModel = gltf.scene;

          const bounds = new THREE.Box3().setFromObject(
            shirtModel
          );

          modelSize = bounds.getSize(
            new THREE.Vector3()
          );

          const modelCenter = bounds.getCenter(
            new THREE.Vector3()
          );

          if (
            !Number.isFinite(modelSize.y) ||
            modelSize.y <= 0 ||
            modelSize.x <= 0
          ) {
            throw new Error(
              "Dimensions du modèle 3D invalides."
            );
          }

          shirtPivot = new THREE.Group();

          // Centrage du modèle
          shirtModel.position.copy(modelCenter).negate();

          shirtPivot.add(shirtModel);
          scene.add(shirtPivot);

          shirtPivot.rotation.set(
            0,
            INITIAL_ROTATION_Y,
            0
          );

          /* =====================================
             MATÉRIAUX, COULEURS ET TISSU
             Repris du fichier index.html original
          ===================================== */

          shirtModel.traverse((object) => {
            if (!object.isMesh) return;

            object.frustumCulled = false;

            const geometry = object.geometry;

            geometry.computeBoundingBox();

            const meshBounds = geometry.boundingBox;

            const meshMinY = meshBounds.min.y;

            const meshHeight = Math.max(
              meshBounds.max.y - meshBounds.min.y,
              0.001
            );

            const meshCenterX =
              (meshBounds.min.x + meshBounds.max.x) / 2;

            const meshWidth = Math.max(
              meshBounds.max.x - meshBounds.min.x,
              0.001
            );

            const materials = Array.isArray(object.material)
              ? object.material
              : [object.material];

            materials.forEach((material) => {

              const windUniforms = {
                uTime: { value: 0 },

                uMinY: { value: meshMinY },

                uInvHeight: {
                  value: 1 / meshHeight
                },

                uHeight: {
                  value: meshHeight
                },

                uCenterX: {
                  value: meshCenterX
                },

                uInvWidth: {
                  value: 1 / meshWidth
                },

                uSaturation: {
                  value: window.innerWidth >= 768
                    ? 1.08
                    : 1.04
                },

                uContrast: {
                  value: 1.04
                }
              };

              material.onBeforeCompile = (shader) => {

                shader.uniforms.uTime =
                  windUniforms.uTime;

                shader.uniforms.uMinY =
                  windUniforms.uMinY;

                shader.uniforms.uInvHeight =
                  windUniforms.uInvHeight;

                shader.uniforms.uHeight =
                  windUniforms.uHeight;

                shader.uniforms.uCenterX =
                  windUniforms.uCenterX;

                shader.uniforms.uInvWidth =
                  windUniforms.uInvWidth;

                shader.uniforms.uSaturation =
                  windUniforms.uSaturation;

                shader.uniforms.uContrast =
                  windUniforms.uContrast;

                material.userData.windShader = shader;

                animatedShaders.push(shader);

                /* DÉFORMATION DU TISSU */

                shader.vertexShader =
                  shader.vertexShader.replace(
                    "#include <common>",
                    `#include <common>
                    uniform float uTime;
                    uniform float uMinY;
                    uniform float uInvHeight;
                    uniform float uHeight;
                    uniform float uCenterX;
                    uniform float uInvWidth;`
                  );

                shader.vertexShader =
                  shader.vertexShader.replace(
                    "#include <begin_vertex>",
                    `#include <begin_vertex>

                    float heightRatio = clamp(
                      (position.y - uMinY) * uInvHeight,
                      0.0,
                      1.0
                    );

                    float hem = 1.0 - smoothstep(
                      0.10,
                      0.55,
                      heightRatio
                    );

                    float sideRatio = abs(
                      (position.x - uCenterX) * uInvWidth
                    );

                    float sides = smoothstep(
                      0.25,
                      0.85,
                      sideRatio
                    );

                    float windWeight = max(
                      hem,
                      sides * 0.65
                    );

                    float wave = sin(
                      uTime * 1.15 +
                      position.y * 3.0 +
                      position.x * 2.0
                    );

                    float wave2 = sin(
                      uTime * 0.75 +
                      position.y * 1.8 -
                      position.x * 2.4
                    );

                    transformed.x +=
                      wave * windWeight * uHeight * 0.006;

                    transformed.z +=
                      wave2 * windWeight * uHeight * 0.004;
                    `
                  );

                /* SATURATION ET CONTRASTE */

                shader.fragmentShader =
                  shader.fragmentShader.replace(
                    "#include <common>",
                    `#include <common>
                    uniform float uSaturation;
                    uniform float uContrast;`
                  );

                shader.fragmentShader =
                  shader.fragmentShader.replace(
                    "#include <color_fragment>",
                    `#include <color_fragment>

                    float luma = dot(
                      diffuseColor.rgb,
                      vec3(0.2126, 0.7152, 0.0722)
                    );

                    diffuseColor.rgb = mix(
                      vec3(luma),
                      diffuseColor.rgb,
                      uSaturation
                    );

                    diffuseColor.rgb = (
                      diffuseColor.rgb - vec3(0.5)
                    ) * uContrast + vec3(0.5);
                    `
                  );
              };

              material.customProgramCacheKey = () =>
                "ekdys-shift-color-wind-v11";

              material.needsUpdate = true;

            });
          });

          updateShirtFit();

          loading.style.display = "none";

          console.log(
            "EKDYS SHIFT COLUMN : modèle chargé."
          );

        } catch (error) {
          loading.textContent =
            "ERREUR : " + error.message;

          console.error(
            "Erreur modèle :",
            error
          );
        }
      },

      (progress) => {
        if (progress.total > 0) {
          loading.textContent =
            "EKDYS — LOADING " +
            Math.round(
              progress.loaded / progress.total * 100
            ) +
            "%";
        }
      },

      (error) => {
        loading.textContent =
          "ERREUR DE CHARGEMENT DU MODÈLE 3D";

        console.error(
          "Erreur GLB :",
          error
        );
      }
    );

    /* =========================================
       RÉCEPTION DU SCROLL CARRD
    ========================================= */

    function receiveScrollProgress(progress) {
      const p = THREE.MathUtils.clamp(
        progress,
        0,
        1
      );

      // Première réception : position réelle de la page
      if (!initializedScroll) {
        initializedScroll = true;

        scrollTarget = p;
        scrollCurrent = p;

        lastReceivedProgress = p;

        hasLeftTop = p > TOP_THRESHOLD;
        hasLeftBottom = p < BOTTOM_THRESHOLD;

        return;
      }

      const previous = lastReceivedProgress;

      const scrollChanged =
        Math.abs(p - previous) > 0.00001;

      /*
        Dès que le scroll reprend après une manipulation
        de la souris ou du doigt, le contrôle automatique
        reprend la main.

        Les compteurs d'oscillations ne sont pas réinitialisés.
      */

      if (scrollChanged) {
        mouseOffsetDeg = 0;
      }

      // Réarmement de la détection des extrémités
      if (p > TOP_THRESHOLD) {
        hasLeftTop = true;
      }

      if (p < BOTTOM_THRESHOLD) {
        hasLeftBottom = true;
      }

      // Si l'utilisateur repart avant l'arrivée en bas
      if (
        pendingBounce === "bottom" &&
        p < BOTTOM_THRESHOLD
      ) {
        pendingBounce = null;
      }

      // Si l'utilisateur repart avant l'arrivée en haut
      if (
        pendingBounce === "top" &&
        p > TOP_THRESHOLD
      ) {
        pendingBounce = null;
      }

      /*
        Interrompt une oscillation lorsqu'on repart
        de son extrémité : elle reprendra au prochain
        passage complet à la limite.
      */

      if (
        bounceState &&
        scrollChanged
      ) {
        if (
          bounceState.endpoint === "bottom" &&
          p < BOTTOM_THRESHOLD
        ) {
          bounceState = null;
        }

        if (
          bounceState.endpoint === "top" &&
          p > TOP_THRESHOLD
        ) {
          bounceState = null;
        }
      }

      // Détection de l'arrivée en bas
      if (
        p >= BOTTOM_THRESHOLD &&
        previous < BOTTOM_THRESHOLD &&
        hasLeftBottom
      ) {
        pendingBounce = "bottom";
        hasLeftBottom = false;
      }

      // Détection de l'arrivée en haut
      if (
        p <= TOP_THRESHOLD &&
        previous > TOP_THRESHOLD &&
        hasLeftTop
      ) {
        pendingBounce = "top";
        hasLeftTop = false;
      }

      lastReceivedProgress = p;
      scrollTarget = p;
    }

    window.addEventListener(
      "message",
      (event) => {
        if (event.source !== window.parent) return;

        if (
          event.data &&
          event.data.type === "EKDYS_SCROLL" &&
          typeof event.data.progress === "number"
        ) {
          receiveScrollProgress(
            event.data.progress
          );
        }
      }
    );

    /* =========================================
       DÉCLENCHEMENT DES ALLERS-RETOURS
    ========================================= */

    function startBounce(endpoint) {
      let cycles;

      if (endpoint === "bottom") {
        bottomLimitHits++;
        cycles = bottomLimitHits;
      } else {
        topLimitHits++;
        cycles = topLimitHits;
      }

      bounceState = {
        endpoint: endpoint,
        startTime: performance.now(),
        cycles: cycles,
        duration: cycles * BOUNCE_CYCLE_MS
      };

      console.info(
        "EKDYS : limite " +
        endpoint +
        " atteinte " +
        cycles +
        " fois. Nombre d'allers-retours : " +
        cycles
      );
    }

    /* =========================================
       CALCUL DES OSCILLATIONS
    ========================================= */

    function getBounceOffsetDeg(now) {
      if (!bounceState) return 0;

      const elapsed =
        now - bounceState.startTime;

      if (elapsed >= bounceState.duration) {
        bounceState = null;
        return 0;
      }

      const cycleProgress =
        (elapsed % BOUNCE_CYCLE_MS) /
        BOUNCE_CYCLE_MS;

      // Un cycle : excursion puis retour à la limite
      const oscillation =
        (1 - Math.cos(2 * Math.PI * cycleProgress)) / 2;

      return BOUNCE_AMPLITUDE_DEG * oscillation;
    }

    /* =========================================
       ROTATION AUTOMATIQUE
    ========================================= */

    function getAutomaticAngleDeg(now) {
      const scrollAngle =
        -scrollCurrent * MAX_ANGLE_DEG;

      const bounceAngle =
        getBounceOffsetDeg(now);

      return scrollAngle + bounceAngle;
    }

    /* =========================================
       ROTATION FINALE

       Limite absolue : -25° à +25°
    ========================================= */

    function getFinalAngleDeg(now) {
      const automaticAngle =
        getAutomaticAngleDeg(now);

      const combinedAngle =
        automaticAngle + mouseOffsetDeg;

      return THREE.MathUtils.clamp(
        combinedAngle,
        MIN_ANGLE_DEG,
        MAX_ANGLE_DEG
      );
    }

    function updateShirtRotation(now) {
      if (!shirtPivot) return;

      const angleDeg =
        getFinalAngleDeg(now);

      shirtPivot.rotation.y =
        INITIAL_ROTATION_Y +
        THREE.MathUtils.degToRad(angleDeg);
    }

    /* =========================================
       SOURIS ET ÉCRAN TACTILE

       Le contrôle fonctionne sur toute la surface
       de la fenêtre 3D, pas uniquement sur le mesh.
    ========================================= */

    canvas.addEventListener(
      "pointerdown",
      (event) => {
        if (
          event.pointerType === "mouse" &&
          event.button !== 0
        ) {
          return;
        }

        event.preventDefault();

        isDragging = true;
        activePointerId = event.pointerId;

        dragStartX = event.clientX;

        dragStartAngleDeg =
          getFinalAngleDeg(performance.now());

        canvas.classList.add("dragging");

        try {
          canvas.setPointerCapture(
            event.pointerId
          );
        } catch (error) {
          console.warn(
            "Capture du pointeur impossible :",
            error
          );
        }
      }
    );

    canvas.addEventListener(
      "pointermove",
      (event) => {
        if (
          !isDragging ||
          event.pointerId !== activePointerId
        ) {
          return;
        }

        event.preventDefault();

        const horizontalMovement =
          event.clientX - dragStartX;

        const desiredAngleDeg =
          dragStartAngleDeg +
          horizontalMovement * MOUSE_DEGREES_PER_PIXEL;

        const limitedAngleDeg =
          THREE.MathUtils.clamp(
            desiredAngleDeg,
            MIN_ANGLE_DEG,
            MAX_ANGLE_DEG
          );

        const automaticAngle =
          getAutomaticAngleDeg(performance.now());

        // La commande manuelle complète la rotation du scroll
        mouseOffsetDeg =
          limitedAngleDeg - automaticAngle;
      }
    );

    function stopDragging(event) {
      if (!isDragging) return;

      if (
        event &&
        event.pointerId !== activePointerId
      ) {
        return;
      }

      const pointerId = activePointerId;

      isDragging = false;
      activePointerId = null;

      canvas.classList.remove("dragging");

      if (
        pointerId !== null &&
        canvas.hasPointerCapture(pointerId)
      ) {
        try {
          canvas.releasePointerCapture(pointerId);
        } catch (error) {
          // La capture peut déjà avoir été libérée
        }
      }
    }

    canvas.addEventListener(
      "pointerup",
      stopDragging
    );

    canvas.addEventListener(
      "pointercancel",
      stopDragging
    );

    canvas.addEventListener(
      "lostpointercapture",
      stopDragging
    );

    /* =========================================
       REDIMENSIONNEMENT
    ========================================= */

    function resize() {
      const width = container.clientWidth;
      const height = container.clientHeight;

      if (!width || !height) return;

      camera.aspect = width / height;

      camera.updateProjectionMatrix();

      renderer.setSize(width, height);

      // Même saturation que le fichier principal
      const saturation =
        width >= 768 ? 1.08 : 1.04;

      animatedShaders.forEach((shader) => {
        shader.uniforms.uSaturation.value =
          saturation;
      });

      updateShirtFit();
    }

    const resizeObserver =
      new ResizeObserver(resize);

    resizeObserver.observe(container);

    window.addEventListener("resize", resize);

    /* =========================================
       ANIMATION PRINCIPALE
    ========================================= */

    renderer.setAnimationLoop(() => {

      const time = clock.getElapsedTime();
      const now = performance.now();

      /* LISSAGE DU SCROLL */

      scrollCurrent +=
        (scrollTarget - scrollCurrent) *
        SCROLL_SMOOTHING;

      /* ANIMATION DU TISSU */

      animatedShaders.forEach((shader) => {
        shader.uniforms.uTime.value = time;
      });

      /* ARRIVÉE EFFECTIVE EN BAS */

      if (
        pendingBounce === "bottom" &&
        scrollCurrent >= 0.995
      ) {
        scrollCurrent = 1;

        startBounce("bottom");

        pendingBounce = null;
      }

      /* ARRIVÉE EFFECTIVE EN HAUT */

      if (
        pendingBounce === "top" &&
        scrollCurrent <= 0.005
      ) {
        scrollCurrent = 0;

        startBounce("top");

        pendingBounce = null;
      }

      /* ROTATION DU T-SHIRT */

      updateShirtRotation(now);

      /* RENDU */

      renderer.render(scene, camera);
    });

    /* =========================================
       INITIALISATION
    ========================================= */

    resize();

  </script>

</body>
