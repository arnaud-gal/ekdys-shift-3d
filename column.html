
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EKDYS — SHIFT COLUMN 3D</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    body {
      position: relative;
    }

    #ekdys-column-canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      cursor: grab;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    #ekdys-column-canvas:active {
      cursor: grabbing;
    }
  </style>
</head>

<body>
  <canvas id="ekdys-column-canvas"></canvas>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

    /* =========================================
       EKDYS — SHIFT COLUMN 3D

       - Rotation automatique par scroll
       - Limites globales : -25° à +25°
       - Oscillations cumulatives aux extrémités
       - Rotation manuelle à la souris
       - Aucun zoom
       - Aucune rotation automatique permanente
    ========================================= */

    const canvas = document.querySelector("#ekdys-column-canvas");

    /* =========================================
       PARAMÈTRES PRINCIPAUX
    ========================================= */

    const INITIAL_ROTATION_Y = 0.34;

    // Limites totales autour de l'orientation initiale
    const MAX_ANGLE_DEG = 25;
    const MIN_ANGLE_DEG = -25;

    const MAX_ANGLE = THREE.MathUtils.degToRad(MAX_ANGLE_DEG);

    // Rotation automatique du scroll : 0° à -25°
    const SCROLL_SMOOTHING = 0.09;

    // Réglages des oscillations aux extrémités
    const BOUNCE_AMPLITUDE_DEG = 6;
    const BOUNCE_CYCLE_MS = 550;

    // Sensibilité du déplacement à la souris
    const MOUSE_DEGREES_PER_PIXEL = 0.25;

    // Caméra fixe : aucun zoom
    const CAMERA_Z = 15;

    // Seuils de détection des extrémités
    const TOP_THRESHOLD = 0.001;
    const BOTTOM_THRESHOLD = 0.999;

    let scrollTarget = 0;
    let scrollCurrent = 0;
    let lastReceivedProgress = null;

    let hasLeftTop = false;
    let hasLeftBottom = false;

    let pendingBounce = null;

    let topLimitHits = 0;
    let bottomLimitHits = 0;

    let bounceState = null;

    let shirtPivot = null;
    let shirtModel = null;

    // Décalage manuel conservé après le glissement
    let mouseOffsetDeg = 0;

    // État du glissement
    let isDragging = false;
    let activePointerId = null;
    let dragStartX = 0;
    let dragStartAngleDeg = 0;

    /* =========================================
       SCÈNE ET CAMÉRA
    ========================================= */

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      32,
      1,
      0.1,
      100
    );

    camera.position.set(0, 0, CAMERA_Z);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      alpha: true,
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

    renderer.setSize(
      Math.max(canvas.clientWidth, 1),
      Math.max(canvas.clientHeight, 1),
      false
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.setClearColor(0x000000, 0);

    /* =========================================
       ÉCLAIRAGE EKDYS
    ========================================= */

    const hemisphereLight = new THREE.HemisphereLight(
      0xffffff,
      0x38313a,
      1.8
    );
    scene.add(hemisphereLight);

    const keyLight = new THREE.DirectionalLight(
      0xffffff,
      3.2
    );
    keyLight.position.set(1.5, 4, 4);
    scene.add(keyLight);

    const sideLight = new THREE.DirectionalLight(
      0xe8eaf2,
      1.8
    );
    sideLight.position.set(-4, 1.5, 2);
    scene.add(sideLight);

    const rimLight = new THREE.DirectionalLight(
      0xd43b58,
      1.4
    );
    rimLight.position.set(-3, 1, -3);
    scene.add(rimLight);

    const fillLight = new THREE.DirectionalLight(
      0xffffff,
      1.2
    );
    fillLight.position.set(0, -1, 5);
    scene.add(fillLight);

    const frontLight = new THREE.DirectionalLight(
      0xffffff,
      0.8
    );
    frontLight.position.set(0, 2, 6);
    scene.add(frontLight);

    /* =========================================
       PIVOT CENTRAL DU T-SHIRT
    ========================================= */

    shirtPivot = new THREE.Group();

    shirtPivot.rotation.y = INITIAL_ROTATION_Y;

    scene.add(shirtPivot);

    /* =========================================
       CHARGEMENT DU MODÈLE 3D
    ========================================= */

    const loader = new GLTFLoader();

    const dracoLoader = new DRACOLoader();

    dracoLoader.setDecoderPath(
      "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
    );

    loader.setDRACOLoader(dracoLoader);

    loader.load(
      "./shift.glb",

      function (gltf) {
        shirtModel = gltf.scene;

        // Calcul du centre du modèle
        const initialBox = new THREE.Box3().setFromObject(shirtModel);

        const center = new THREE.Vector3();

        initialBox.getCenter(center);

        // Centrage sur le pivot
        shirtModel.position.sub(center);

        shirtPivot.add(shirtModel);

        // Adaptation à la fenêtre
        fitShirt();

        // Orientation initiale
        updateShirtRotation();
      },

      undefined,

      function (error) {
        console.error(
          "Erreur de chargement du modèle SHIFT :",
          error
        );
      }
    );

    /* =========================================
       ADAPTATION À LA TAILLE DE LA COLONNE

       Cette fonction ne modifie jamais le zoom
       en fonction du scroll.
    ========================================= */

    function fitShirt() {
      if (!shirtModel) return;

      const box = new THREE.Box3().setFromObject(shirtModel);

      const size = new THREE.Vector3();

      box.getSize(size);

      const aspect = Math.max(
        canvas.clientWidth / Math.max(canvas.clientHeight, 1),
        0.1
      );

      const verticalFov = THREE.MathUtils.degToRad(camera.fov);

      const visibleHeight =
        2 * CAMERA_Z * Math.tan(verticalFov / 2);

      const visibleWidth = visibleHeight * aspect;

      const modelHeight = Math.max(size.y, 0.001);

      const modelWidth = Math.max(
        Math.sqrt(size.x * size.x + size.z * size.z),
        0.001
      );

      const scaleHeight = (visibleHeight * 0.88) / modelHeight;

      const scaleWidth = (visibleWidth * 0.88) / modelWidth;

      const finalScale = Math.min(
        scaleHeight,
        scaleWidth
      );

      shirtModel.scale.setScalar(finalScale);
    }

    /* =========================================
       RÉCEPTION DU SCROLL CARRD
    ========================================= */

    function receiveScrollProgress(progress) {
      const p = THREE.MathUtils.clamp(progress, 0, 1);

      // Première réception : initialisation sans oscillation
      if (lastReceivedProgress === null) {
        lastReceivedProgress = p;

        scrollTarget = p;
        scrollCurrent = p;

        hasLeftTop = p > TOP_THRESHOLD;
        hasLeftBottom = p < BOTTOM_THRESHOLD;

        return;
      }

      const previous = lastReceivedProgress;

      // Détection du départ depuis le haut
      if (p > TOP_THRESHOLD) {
        hasLeftTop = true;
      }

      // Détection du départ depuis le bas
      if (p < BOTTOM_THRESHOLD) {
        hasLeftBottom = true;
      }

      // Annule une oscillation en attente si l'on repart
      // avant que le mouvement vers l'extrémité soit terminé
      if (pendingBounce === "bottom" && p < BOTTOM_THRESHOLD) {
        pendingBounce = null;
      }

      if (pendingBounce === "top" && p > TOP_THRESHOLD) {
        pendingBounce = null;
      }

      // Arrivée en bas après avoir quitté cette limite
      if (
        p >= BOTTOM_THRESHOLD &&
        previous < BOTTOM_THRESHOLD &&
        hasLeftBottom
      ) {
        pendingBounce = "bottom";
        hasLeftBottom = false;
      }

      // Arrivée en haut après avoir quitté cette limite
      if (
        p <= TOP_THRESHOLD &&
        previous > TOP_THRESHOLD &&
        hasLeftTop
      ) {
        pendingBounce = "top";
        hasLeftTop = false;
      }

      lastReceivedProgress = p;

      scrollTarget = p;
    }

    window.addEventListener("message", function (event) {
      if (
        event.data &&
        event.data.type === "EKDYS_SCROLL" &&
        typeof event.data.progress === "number"
      ) {
        receiveScrollProgress(event.data.progress);
      }
    });

    /* =========================================
       DÉCLENCHEMENT DES OSCILLATIONS
    ========================================= */

    function startBounce(endpoint) {
      let numberOfCycles;

      if (endpoint === "bottom") {
        bottomLimitHits++;
        numberOfCycles = bottomLimitHits;
      } else {
        topLimitHits++;
        numberOfCycles = topLimitHits;
      }

      bounceState = {
        endpoint: endpoint,
        startTime: performance.now(),
        cycles: numberOfCycles,
        duration: numberOfCycles * BOUNCE_CYCLE_MS
      };

      console.info(
        "EKDYS : limite " + endpoint +
        " atteinte " + numberOfCycles +
        " fois — " + numberOfCycles + " aller-retour(s)."
      );
    }

    /* =========================================
       CALCUL DE L'OSCILLATION
    ========================================= */

    function getBounceOffsetDeg(now) {
      if (!bounceState) return 0;

      const elapsed = now - bounceState.startTime;

      if (elapsed >= bounceState.duration) {
        bounceState = null;
        return 0;
      }

      const cycleProgress =
        (elapsed % BOUNCE_CYCLE_MS) / BOUNCE_CYCLE_MS;

      // Un cycle complet : départ, excursion, retour
      const oscillation =
        (1 - Math.cos(2 * Math.PI * cycleProgress)) / 2;

      return BOUNCE_AMPLITUDE_DEG * oscillation;
    }

    /* =========================================
       ANGLE AUTOMATIQUE ACTUEL
    ========================================= */

    function getAutomaticAngleDeg(now) {
      const scrollAngle = -scrollCurrent * MAX_ANGLE_DEG;

      const bounceAngle = getBounceOffsetDeg(now);

      return scrollAngle + bounceAngle;
    }

    /* =========================================
       ANGLE FINAL VISIBLE

       Le t-shirt ne dépasse jamais :
       -25° à gauche
       +25° à droite
    ========================================= */

    function getFinalAngleDeg(now) {
      const automaticAngle = getAutomaticAngleDeg(now);

      const combinedAngle = automaticAngle + mouseOffsetDeg;

      return THREE.MathUtils.clamp(
        combinedAngle,
        MIN_ANGLE_DEG,
        MAX_ANGLE_DEG
      );
    }

    /* =========================================
       APPLICATION DE LA ROTATION
    ========================================= */

    function updateShirtRotation(now) {
      if (!shirtPivot) return;

      const finalAngleDeg = getFinalAngleDeg(now);

      const finalAngleRad = THREE.MathUtils.degToRad(
        finalAngleDeg
      );

      shirtPivot.rotation.y =
        INITIAL_ROTATION_Y + finalAngleRad;
    }

    /* =========================================
       CONTRÔLE À LA SOURIS

       Déplacement horizontal uniquement.
       La position manuelle est conservée.
    ========================================= */

    canvas.addEventListener("pointerdown", function (event) {
      if (event.pointerType === "mouse" && event.button !== 0) {
        return;
      }

      isDragging = true;
      activePointerId = event.pointerId;

      dragStartX = event.clientX;

      dragStartAngleDeg = getFinalAngleDeg(performance.now());

      canvas.style.cursor = "grabbing";

      try {
        canvas.setPointerCapture(event.pointerId);
      } catch (error) {
        console.warn("Capture du pointeur indisponible :", error);
      }
    });

    canvas.addEventListener("pointermove", function (event) {
      if (!isDragging || event.pointerId !== activePointerId) {
        return;
      }

      const horizontalMovement =
        event.clientX - dragStartX;

      // Angle souhaité à partir de la position de départ
      const desiredAngleDeg =
        dragStartAngleDeg +
        horizontalMovement * MOUSE_DEGREES_PER_PIXEL;

      // Respect des deux limites globales
      const limitedAngleDeg = THREE.MathUtils.clamp(
        desiredAngleDeg,
        MIN_ANGLE_DEG,
        MAX_ANGLE_DEG
      );

      // La souris agit sur l'orientation combinée
      // sans supprimer l'influence du scroll.
      const automaticAngle = getAutomaticAngleDeg(
        performance.now()
      );

      mouseOffsetDeg = limitedAngleDeg - automaticAngle;
    });

    function endDragging(event) {
      if (!isDragging) return;

      if (
        event &&
        activePointerId !== null &&
        event.pointerId !== activePointerId
      ) {
        return;
      }

      isDragging = false;

      const previousPointerId = activePointerId;

      activePointerId = null;

      canvas.style.cursor = "grab";

      if (
        previousPointerId !== null &&
        canvas.hasPointerCapture(previousPointerId)
      ) {
        try {
          canvas.releasePointerCapture(previousPointerId);
        } catch (error) {
          // Aucun traitement nécessaire
        }
      }
    }

    canvas.addEventListener("pointerup", endDragging);
    canvas.addEventListener("pointercancel", endDragging);
    canvas.addEventListener("lostpointercapture", endDragging);

    /* =========================================
       REDIMENSIONNEMENT
    ========================================= */

    function resizeRenderer() {
      const width = Math.max(canvas.clientWidth, 1);
      const height = Math.max(canvas.clientHeight, 1);

      renderer.setSize(width, height, false);

      camera.aspect = width / height;

      camera.updateProjectionMatrix();

      fitShirt();
    }

    const resizeObserver = new ResizeObserver(resizeRenderer);

    resizeObserver.observe(canvas);

    window.addEventListener("resize", resizeRenderer);

    /* =========================================
       BOUCLE DE RENDU
    ========================================= */

    function animate(now) {
      requestAnimationFrame(animate);

      // Lissage de la progression du scroll
      scrollCurrent +=
        (scrollTarget - scrollCurrent) * SCROLL_SMOOTHING;

      // Termine proprement le déplacement aux extrémités
      if (
        pendingBounce === "bottom" &&
        scrollCurrent >= 0.995
      ) {
        scrollCurrent = 1;
        startBounce("bottom");
        pendingBounce = null;
      }

      if (
        pendingBounce === "top" &&
        scrollCurrent <= 0.005
      ) {
        scrollCurrent = 0;
        startBounce("top");
        pendingBounce = null;
      }

      updateShirtRotation(now);

      renderer.render(scene, camera);
    }

    /* =========================================
       INITIALISATION
    ========================================= */

    resizeRenderer();

    requestAnimationFrame(animate);
  </script>
</body>
</html>
