
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EKDYS — SHIFT COLUMN 3D</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }

    #ekdys-column-canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;

      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    #ekdys-column-canvas.dragging {
      cursor: grabbing;
    }
  </style>
</head>

<body>
  <canvas id="ekdys-column-canvas"></canvas>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

    /* =========================================
       EKDYS — SHIFT COLUMN 3D
    ========================================= */

    const canvas = document.querySelector("#ekdys-column-canvas");

    /* =========================================
       PARAMÈTRES GÉNÉRAUX
    ========================================= */

    const INITIAL_ROTATION_Y = 0.34;

    // Limites absolues de rotation
    const MIN_ANGLE_DEG = -25;
    const MAX_ANGLE_DEG = 25;

    // Rotation automatique liée au scroll
    const SCROLL_SMOOTHING = 0.09;

    // Oscillations aux extrémités
    const BOUNCE_AMPLITUDE_DEG = 6;
    const BOUNCE_CYCLE_MS = 550;

    // Sensibilité du glissement souris / doigt
    const MOUSE_DEGREES_PER_PIXEL = 0.25;

    // Caméra fixe
    const CAMERA_Z = 15;

    // Détection des extrémités de la page
    const TOP_THRESHOLD = 0.001;
    const BOTTOM_THRESHOLD = 0.999;

    /* =========================================
       VARIABLES
    ========================================= */

    let shirtPivot = null;
    let shirtModel = null;

    // Dimensions originales du modèle, avant mise à l'échelle
    let originalModelSize = null;

    let scrollTarget = 0;
    let scrollCurrent = 0;
    let initializedScroll = false;
    let lastReceivedProgress = null;

    let hasLeftTop = false;
    let hasLeftBottom = false;

    let pendingBounce = null;
    let bounceState = null;

    let topLimitHits = 0;
    let bottomLimitHits = 0;

    // Décalage manuel
    let mouseOffsetDeg = 0;

    // Contrôle du pointeur
    let isDragging = false;
    let activePointerId = null;
    let dragStartX = 0;
    let dragStartAngleDeg = 0;

    /* =========================================
       SCÈNE ET CAMÉRA
    ========================================= */

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      32,
      1,
      0.1,
      100
    );

    camera.position.set(0, 0, CAMERA_Z);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      alpha: true,
      antialias: true,
      powerPreference: "high-performance"
    });

    renderer.setPixelRatio(
      Math.min(window.devicePixelRatio, 1.5)
    );

    renderer.setSize(
      Math.max(canvas.clientWidth, 1),
      Math.max(canvas.clientHeight, 1),
      false
    );

    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.setClearColor(0x000000, 0);

    /* =========================================
       ÉCLAIRAGE EKDYS
    ========================================= */

    const hemisphereLight = new THREE.HemisphereLight(
      0xffffff,
      0x38313a,
      1.8
    );
    scene.add(hemisphereLight);

    const keyLight = new THREE.DirectionalLight(
      0xffffff,
      3.2
    );
    keyLight.position.set(1.5, 4, 4);
    scene.add(keyLight);

    const sideLight = new THREE.DirectionalLight(
      0xe8eaf2,
      1.8
    );
    sideLight.position.set(-4, 1.5, 2);
    scene.add(sideLight);

    const rimLight = new THREE.DirectionalLight(
      0xd43b58,
      1.4
    );
    rimLight.position.set(-3, 1, -3);
    scene.add(rimLight);

    const fillLight = new THREE.DirectionalLight(
      0xffffff,
      1.2
    );
    fillLight.position.set(0, -1, 5);
    scene.add(fillLight);

    const frontLight = new THREE.DirectionalLight(
      0xffffff,
      0.8
    );
    frontLight.position.set(0, 2, 6);
    scene.add(frontLight);

    /* =========================================
       PIVOT CENTRAL
    ========================================= */

    shirtPivot = new THREE.Group();
    shirtPivot.rotation.y = INITIAL_ROTATION_Y;
    scene.add(shirtPivot);

    /* =========================================
       CHARGEMENT DU T-SHIRT
    ========================================= */

    const loader = new GLTFLoader();

    const dracoLoader = new DRACOLoader();

    dracoLoader.setDecoderPath(
      "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
    );

    loader.setDRACOLoader(dracoLoader);

    loader.load(
      "./shift.glb",

      function (gltf) {
        shirtModel = gltf.scene;

        // Dimensions originales calculées une seule fois
        const originalBox = new THREE.Box3().setFromObject(shirtModel);

        const center = new THREE.Vector3();
        const originalSize = new THREE.Vector3();

        originalBox.getCenter(center);
        originalBox.getSize(originalSize);

        originalModelSize = originalSize.clone();

        // Centrage du modèle sur son pivot
        shirtModel.position.sub(center);

        // Ajout à la scène
        shirtPivot.add(shirtModel);

        // Mise à l'échelle initiale
        fitShirt();

        updateShirtRotation(performance.now());
      },

      undefined,

      function (error) {
        console.error(
          "Erreur de chargement du modèle SHIFT :",
          error
        );
      }
    );

    /* =========================================
       DIMENSIONNEMENT DU T-SHIRT

       IMPORTANT :
       On utilise toujours les dimensions originales.
       Le modèle ne rétrécit donc plus à chaque resize.
    ========================================= */

    function fitShirt() {
      if (!shirtModel || !originalModelSize) return;

      const width = Math.max(canvas.clientWidth, 1);
      const height = Math.max(canvas.clientHeight, 1);

      const aspect = width / height;

      const verticalFov = THREE.MathUtils.degToRad(camera.fov);

      const visibleHeight =
        2 * CAMERA_Z * Math.tan(verticalFov / 2);

      const visibleWidth = visibleHeight * aspect;

      const modelHeight = Math.max(
        originalModelSize.y,
        0.001
      );

      // Largeur maximale anticipant la rotation du modèle
      const modelWidth = Math.max(
        Math.sqrt(
          originalModelSize.x * originalModelSize.x +
          originalModelSize.z * originalModelSize.z
        ),
        0.001
      );

      // Le t-shirt occupe davantage de hauteur
      const scaleHeight =
        (visibleHeight * 0.94) / modelHeight;

      const scaleWidth =
        (visibleWidth * 0.94) / modelWidth;

      const finalScale = Math.min(
        scaleHeight,
        scaleWidth
      );

      // Échelle absolue, jamais cumulative
      shirtModel.scale.setScalar(finalScale);
    }

    /* =========================================
       RÉCEPTION DU SCROLL DE CARRD
    ========================================= */

    function receiveScrollProgress(progress) {
      const p = THREE.MathUtils.clamp(progress, 0, 1);

      // Initialisation à la position réelle de la page
      if (!initializedScroll) {
        initializedScroll = true;

        scrollTarget = p;
        scrollCurrent = p;
        lastReceivedProgress = p;

        hasLeftTop = p > TOP_THRESHOLD;
        hasLeftBottom = p < BOTTOM_THRESHOLD;

        return;
      }

      const previous = lastReceivedProgress;

      // Si le scroll reprend après une manipulation manuelle,
      // on rend la main à la rotation automatique.
      if (Math.abs(p - previous) > 0.00001) {
        mouseOffsetDeg = 0;
      }

      // Réarmement de la détection du haut et du bas
      if (p > TOP_THRESHOLD) {
        hasLeftTop = true;
      }

      if (p < BOTTOM_THRESHOLD) {
        hasLeftBottom = true;
      }

      // Annulation d'une arrivée en attente si l'utilisateur repart
      if (
        pendingBounce === "bottom" &&
        p < BOTTOM_THRESHOLD
      ) {
        pendingBounce = null;
      }

      if (
        pendingBounce === "top" &&
        p > TOP_THRESHOLD
      ) {
        pendingBounce = null;
      }

      // Arrivée en bas
      if (
        p >= BOTTOM_THRESHOLD &&
        previous < BOTTOM_THRESHOLD &&
        hasLeftBottom
      ) {
        pendingBounce = "bottom";
        hasLeftBottom = false;
      }

      // Arrivée en haut
      if (
        p <= TOP_THRESHOLD &&
        previous > TOP_THRESHOLD &&
        hasLeftTop
      ) {
        pendingBounce = "top";
        hasLeftTop = false;
      }

      lastReceivedProgress = p;
      scrollTarget = p;
    }

    window.addEventListener("message", function (event) {
      if (event.source !== window.parent) return;

      if (
        event.data &&
        event.data.type === "EKDYS_SCROLL" &&
        typeof event.data.progress === "number"
      ) {
        receiveScrollProgress(event.data.progress);
      }
    });

    /* =========================================
       DÉCLENCHEMENT DES ALLERS-RETOURS
    ========================================= */

    function startBounce(endpoint) {
      let cycles;

      if (endpoint === "bottom") {
        bottomLimitHits++;
        cycles = bottomLimitHits;
      } else {
        topLimitHits++;
        cycles = topLimitHits;
      }

      bounceState = {
        endpoint: endpoint,
        startTime: performance.now(),
        cycles: cycles,
        duration: cycles * BOUNCE_CYCLE_MS
      };

      console.info(
        "EKDYS : limite " + endpoint +
        " atteinte " + cycles +
        " fois. Nombre d'allers-retours : " + cycles
      );
    }

    /* =========================================
       CALCUL DES OSCILLATIONS
    ========================================= */

    function getBounceOffsetDeg(now) {
      if (!bounceState) return 0;

      const elapsed = now - bounceState.startTime;

      if (elapsed >= bounceState.duration) {
        bounceState = null;
        return 0;
      }

      const cycleProgress =
        (elapsed % BOUNCE_CYCLE_MS) / BOUNCE_CYCLE_MS;

      // Un cycle complet : excursion puis retour
      const oscillation =
        (1 - Math.cos(2 * Math.PI * cycleProgress)) / 2;

      return BOUNCE_AMPLITUDE_DEG * oscillation;
    }

    /* =========================================
       ROTATION AUTOMATIQUE
    ========================================= */

    function getAutomaticAngleDeg(now) {
      const scrollAngle = -scrollCurrent * MAX_ANGLE_DEG;

      const bounceAngle = getBounceOffsetDeg(now);

      return scrollAngle + bounceAngle;
    }

    /* =========================================
       ANGLE FINAL
    ========================================= */

    function getFinalAngleDeg(now) {
      const automaticAngle = getAutomaticAngleDeg(now);

      return THREE.MathUtils.clamp(
        automaticAngle + mouseOffsetDeg,
        MIN_ANGLE_DEG,
        MAX_ANGLE_DEG
      );
    }

    function updateShirtRotation(now) {
      if (!shirtPivot) return;

      const angleDeg = getFinalAngleDeg(now);

      shirtPivot.rotation.y =
        INITIAL_ROTATION_Y +
        THREE.MathUtils.degToRad(angleDeg);
    }

    /* =========================================
       CONTRÔLE SOURIS ET TACTILE
    ========================================= */

    canvas.addEventListener("pointerdown", function (event) {
      if (event.pointerType === "mouse" && event.button !== 0) {
        return;
      }

      event.preventDefault();

      isDragging = true;
      activePointerId = event.pointerId;

      dragStartX = event.clientX;

      dragStartAngleDeg = getFinalAngleDeg(
        performance.now()
      );

      canvas.classList.add("dragging");

      try {
        canvas.setPointerCapture(event.pointerId);
      } catch (error) {
        console.warn("Capture du pointeur impossible :", error);
      }
    });

    canvas.addEventListener("pointermove", function (event) {
      if (!isDragging || event.pointerId !== activePointerId) {
        return;
      }

      event.preventDefault();

      const movementX = event.clientX - dragStartX;

      const desiredAngleDeg =
        dragStartAngleDeg +
        movementX * MOUSE_DEGREES_PER_PIXEL;

      const limitedAngleDeg = THREE.MathUtils.clamp(
        desiredAngleDeg,
        MIN_ANGLE_DEG,
        MAX_ANGLE_DEG
      );

      const automaticAngle = getAutomaticAngleDeg(
        performance.now()
      );

      mouseOffsetDeg =
        limitedAngleDeg - automaticAngle;
    });

    function stopDragging(event) {
      if (!isDragging) return;

      if (
        event &&
        event.pointerId !== activePointerId
      ) {
        return;
      }

      const pointerId = activePointerId;

      isDragging = false;
      activePointerId = null;

      canvas.classList.remove("dragging");

      if (
        pointerId !== null &&
        canvas.hasPointerCapture(pointerId)
      ) {
        try {
          canvas.releasePointerCapture(pointerId);
        } catch (error) {
          // Capture déjà libérée
        }
      }
    }

    canvas.addEventListener("pointerup", stopDragging);
    canvas.addEventListener("pointercancel", stopDragging);
    canvas.addEventListener("lostpointercapture", stopDragging);

    /* =========================================
       REDIMENSIONNEMENT
    ========================================= */

    function resizeRenderer() {
      const width = Math.max(canvas.clientWidth, 1);
      const height = Math.max(canvas.clientHeight, 1);

      renderer.setSize(width, height, false);

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      fitShirt();
    }

    const resizeObserver = new ResizeObserver(resizeRenderer);

    resizeObserver.observe(canvas);

    window.addEventListener("resize", resizeRenderer);

    /* =========================================
       BOUCLE DE RENDU
    ========================================= */

    function animate(now) {
      requestAnimationFrame(animate);

      // Lissage de la progression du scroll
      scrollCurrent +=
        (scrollTarget - scrollCurrent) * SCROLL_SMOOTHING;

      // Arrivée effective en bas
      if (
        pendingBounce === "bottom" &&
        scrollCurrent >= 0.995
      ) {
        scrollCurrent = 1;

        startBounce("bottom");

        pendingBounce = null;
      }

      // Arrivée effective en haut
      if (
        pendingBounce === "top" &&
        scrollCurrent <= 0.005
      ) {
        scrollCurrent = 0;

        startBounce("top");

        pendingBounce = null;
      }

      updateShirtRotation(now);

      renderer.render(scene, camera);
    }

    /* =========================================
       INITIALISATION
    ========================================= */

    resizeRenderer();

    requestAnimationFrame(animate);
  </script>
</body>
</html>
