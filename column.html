
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKDYS — SHIFT 3D COLUMN</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: transparent;
}

#shift-scene {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
}

#shift-background {
    position: absolute;
    inset: 0;
    z-index: 0;
    background: url("./fond-ekdys.png") center / cover no-repeat;
    pointer-events: none;
}

#shift-scene canvas {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: block;
    width: 100%;
    height: 100%;
    pointer-events: none !important;
    touch-action: none;
    user-select: none;
}

#shift-loading {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: grid;
    place-items: center;
    color: #ddd;
    font: 12px Arial, sans-serif;
    letter-spacing: 2px;
    pointer-events: none;
}
</style>

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
}
</script>
</head>

<body>

<div id="shift-scene">
    <div id="shift-background"></div>
    <div id="shift-loading">EKDYS — LOADING</div>
</div>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

/* =========================================
   SCÈNE
========================================= */

const container = document.querySelector("#shift-scene");
const loading = document.querySelector("#shift-loading");

const scene = new THREE.Scene();

/* =========================================
   CAMÉRA
   POSITION FIXE : AUCUN ZOOM
========================================= */

const CAMERA_Z = 15.0;

const camera = new THREE.PerspectiveCamera(
    32,
    container.clientWidth / container.clientHeight,
    0.01,
    100
);

camera.position.set(0, 0, CAMERA_Z);

/* =========================================
   RENDERER
========================================= */

const renderer = new THREE.WebGLRenderer({
    alpha: true,
    antialias: true,
    powerPreference: "high-performance"
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1, 1.5)
);

renderer.setSize(
    container.clientWidth,
    container.clientHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.setClearColor(0x000000, 0);

renderer.domElement.style.pointerEvents = "none";

container.appendChild(renderer.domElement);

/* =========================================
   ÉCLAIRAGE
   IDENTIQUE À LA VERSION ORIGINALE
========================================= */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x38313a,
        1.8
    )
);

const keyLight = new THREE.DirectionalLight(0xffffff, 3.2);
keyLight.position.set(1.5, 4, 4);
scene.add(keyLight);

const sideLight = new THREE.DirectionalLight(0xe8eaf2, 1.8);
sideLight.position.set(-4, 1.5, 2);
scene.add(sideLight);

const rimLight = new THREE.DirectionalLight(0xd43b58, 1.4);
rimLight.position.set(-3, 1, -3);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 1.2);
fillLight.position.set(0, -1, 5);
scene.add(fillLight);

const frontLight = new THREE.DirectionalLight(0xffffff, 0.8);
frontLight.position.set(0, 2, 6);
scene.add(frontLight);

/* =========================================
   DRACO
========================================= */

const dracoLoader = new DRACOLoader();

dracoLoader.setDecoderPath(
    "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
);

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

/* =========================================
   VARIABLES
========================================= */

const clock = new THREE.Clock();

let shirtPivot = null;
let shirtModel = null;

let modelSize = new THREE.Vector3();

const animatedShaders = [];

/* =========================================
   PARAMÈTRES DE ROTATION
========================================= */

/* Orientation de départ */
const INITIAL_ROTATION_Y = 0.34;

/* Vitesse de rotation en radians/seconde */
const ROTATION_SPEED = 0.45;

/*
   0.45 = rotation complète en environ 14 secondes.
   Augmenter pour accélérer.
   Diminuer pour ralentir.
*/

/* =========================================
   CADRAGE RESPONSIVE
   T-SHIRT EN GROS PLAN
========================================= */

function updateShirtFit() {

    if (!shirtPivot || !shirtModel) return;
    if (modelSize.y <= 0 || modelSize.x <= 0) return;

    const width = container.clientWidth;
    const height = container.clientHeight;

    if (!width || !height) return;

    const aspect = width / height;

    const visibleHeight =
        2 *
        Math.tan(
            THREE.MathUtils.degToRad(camera.fov / 2)
        ) *
        CAMERA_Z;

    const visibleWidth = visibleHeight * aspect;

    /*
       Dimensions maximales pendant la rotation.
       Permet d'éviter que le T-shirt soit coupé.
    */

    const rotatedWidth = Math.sqrt(
        modelSize.x * modelSize.x +
        modelSize.z * modelSize.z
    );

    /*
       Valeurs élevées = T-shirt plus grand.
       Le cadrage reste calculé pour toute la rotation.
    */

    const widthMargin = 0.90;
    const heightMargin = 0.90;

    const scaleByWidth =
        (visibleWidth * widthMargin) /
        Math.max(rotatedWidth, 0.001);

    const scaleByHeight =
        (visibleHeight * heightMargin) /
        Math.max(modelSize.y, 0.001);

    const shirtBaseScale = Math.min(
        scaleByWidth,
        scaleByHeight
    );

    shirtPivot.scale.setScalar(shirtBaseScale);

    const scaledHeight = modelSize.y * shirtBaseScale;

    shirtPivot.position.set(
        0,
        -scaledHeight * 0.02,
        0
    );
}

/* =========================================
   CHARGEMENT DU T-SHIRT
========================================= */

loader.load(

    "./shift.glb",

    (gltf) => {

        try {

            shirtModel = gltf.scene;

            const bounds = new THREE.Box3().setFromObject(shirtModel);

            modelSize = bounds.getSize(new THREE.Vector3());

            const modelCenter = bounds.getCenter(
                new THREE.Vector3()
            );

            if (
                !Number.isFinite(modelSize.y) ||
                modelSize.y <= 0 ||
                modelSize.x <= 0
            ) {
                throw new Error("Dimensions du modèle 3D invalides.");
            }

            shirtPivot = new THREE.Group();

            shirtModel.position.copy(modelCenter).negate();

            shirtPivot.add(shirtModel);
            scene.add(shirtPivot);

            shirtPivot.rotation.set(
                0,
                INITIAL_ROTATION_Y,
                0
            );

            /* =================================
               ANIMATION TISSU ET COULEURS
            ================================= */

            shirtModel.traverse((object) => {

                if (!object.isMesh) return;

                object.frustumCulled = false;

                const geometry = object.geometry;
                geometry.computeBoundingBox();

                const meshBounds = geometry.boundingBox;
                const meshMinY = meshBounds.min.y;

                const meshHeight = Math.max(
                    meshBounds.max.y - meshBounds.min.y,
                    0.001
                );

                const meshCenterX =
                    (meshBounds.min.x + meshBounds.max.x) / 2;

                const meshWidth = Math.max(
                    meshBounds.max.x - meshBounds.min.x,
                    0.001
                );

                const materials = Array.isArray(object.material)
                    ? object.material
                    : [object.material];

                materials.forEach((material) => {

                    const windUniforms = {
                        uTime: { value: 0 },
                        uMinY: { value: meshMinY },
                        uInvHeight: { value: 1 / meshHeight },
                        uHeight: { value: meshHeight },
                        uCenterX: { value: meshCenterX },
                        uInvWidth: { value: 1 / meshWidth },
                        uSaturation: {
                            value: window.innerWidth >= 768 ? 1.08 : 1.04
                        },
                        uContrast: { value: 1.04 }
                    };

                    material.onBeforeCompile = (shader) => {

                        shader.uniforms.uTime = windUniforms.uTime;
                        shader.uniforms.uMinY = windUniforms.uMinY;
                        shader.uniforms.uInvHeight = windUniforms.uInvHeight;
                        shader.uniforms.uHeight = windUniforms.uHeight;
                        shader.uniforms.uCenterX = windUniforms.uCenterX;
                        shader.uniforms.uInvWidth = windUniforms.uInvWidth;
                        shader.uniforms.uSaturation = windUniforms.uSaturation;
                        shader.uniforms.uContrast = windUniforms.uContrast;

                        material.userData.windShader = shader;
                        animatedShaders.push(shader);

                        /* DÉFORMATION DU TISSU */

                        shader.vertexShader =
                            shader.vertexShader.replace(
                                "#include <common>",
                                `#include <common>
                                uniform float uTime;
                                uniform float uMinY;
                                uniform float uInvHeight;
                                uniform float uHeight;
                                uniform float uCenterX;
                                uniform float uInvWidth;`
                            );

                        shader.vertexShader =
                            shader.vertexShader.replace(
                                "#include <begin_vertex>",
                                `#include <begin_vertex>

                                float heightRatio = clamp(
                                    (position.y - uMinY) * uInvHeight,
                                    0.0,
                                    1.0
                                );

                                float hem = 1.0 - smoothstep(
                                    0.10, 0.55, heightRatio
                                );

                                float sideRatio = abs(
                                    (position.x - uCenterX) * uInvWidth
                                );

                                float sides = smoothstep(
                                    0.25, 0.85, sideRatio
                                );

                                float windWeight = max(
                                    hem,
                                    sides * 0.65
                                );

                                float wave = sin(
                                    uTime * 1.15 +
                                    position.y * 3.0 +
                                    position.x * 2.0
                                );

                                float wave2 = sin(
                                    uTime * 0.75 +
                                    position.y * 1.8 -
                                    position.x * 2.4
                                );

                                transformed.x +=
                                    wave * windWeight * uHeight * 0.006;

                                transformed.z +=
                                    wave2 * windWeight * uHeight * 0.004;
                                `
                            );

                        /* COULEURS NATURELLES */

                        shader.fragmentShader =
                            shader.fragmentShader.replace(
                                "#include <common>",
                                `#include <common>
                                uniform float uSaturation;
                                uniform float uContrast;`
                            );

                        shader.fragmentShader =
                            shader.fragmentShader.replace(
                                "#include <color_fragment>",
                                `#include <color_fragment>

                                float luma = dot(
                                    diffuseColor.rgb,
                                    vec3(0.2126, 0.7152, 0.0722)
                                );

                                diffuseColor.rgb = mix(
                                    vec3(luma),
                                    diffuseColor.rgb,
                                    uSaturation
                                );

                                diffuseColor.rgb = (
                                    diffuseColor.rgb - vec3(0.5)
                                ) * uContrast + vec3(0.5);
                                `
                            );
                    };

                    material.customProgramCacheKey = () =>
                        "ekdys-shift-color-wind-v11";

                    material.needsUpdate = true;

                });
            });

            updateShirtFit();

            loading.style.display = "none";

            console.log("EKDYS SHIFT COLUMN : modèle chargé.");

        } catch (error) {

            loading.textContent = "ERREUR : " + error.message;
            console.error("Erreur modèle :", error);

        }
    },

    (progress) => {

        if (progress.total > 0) {

            loading.textContent =
                "EKDYS — LOADING " +
                Math.round(progress.loaded / progress.total * 100) +
                "%";

        }
    },

    (error) => {

        loading.textContent = "ERREUR DE CHARGEMENT DU MODÈLE 3D";
        console.error("Erreur GLB :", error);

    }
);

/* =========================================
   REDIMENSIONNEMENT
========================================= */

function resize() {

    const width = container.clientWidth;
    const height = container.clientHeight;

    if (!width || !height) return;

    camera.aspect = width / height;
    camera.updateProjectionMatrix();

    renderer.setSize(width, height);

    const saturation = width >= 768 ? 1.08 : 1.04;

    animatedShaders.forEach((shader) => {
        shader.uniforms.uSaturation.value = saturation;
    });

    updateShirtFit();
}

const resizeObserver = new ResizeObserver(resize);
resizeObserver.observe(container);

window.addEventListener("resize", resize);

/* =========================================
   ANIMATION PRINCIPALE
   ROTATION AUTONOME UNIQUEMENT
========================================= */

renderer.setAnimationLoop(() => {

    const time = clock.getElapsedTime();

    /* ANIMATION DU TISSU */

    animatedShaders.forEach((shader) => {
        shader.uniforms.uTime.value = time;
    });

    /* ROTATION 360° CONTINUE */

    if (shirtPivot) {

        shirtPivot.rotation.y =
            INITIAL_ROTATION_Y + time * ROTATION_SPEED;

    }

    /* AUCUN ZOOM */
    /* AUCUNE ROTATION LIÉE AU SCROLL */
    /* AUCUNE INTERACTION SOURIS */

    renderer.render(scene, camera);

});

</script>

</body>
</html>
