
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EKDYS SHIFT 3D</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent !important;
  border: 0 !important;
  outline: 0 !important;
}

#shift-scene {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  border: 0;
  outline: 0;
}

#shift-background {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: url("./fond-ekdys.png") center / cover no-repeat;
  pointer-events: none;
}

#shift-scene canvas {
  position: absolute;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  display: block;
  border: 0;
  outline: 0;
  touch-action: none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="shift-scene">
  <div id="shift-background"></div>
</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

const container = document.querySelector("#shift-scene");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  32,
  container.clientWidth / container.clientHeight,
  0.01,
  100
);

/* T-SHIRT RECULÉ */
camera.position.set(0, 0, 5.8);

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

container.appendChild(renderer.domElement);

/* ÉCLAIRAGE */
scene.add(new THREE.HemisphereLight(0xffffff, 0x171717, 2));

const keyLight = new THREE.DirectionalLight(0xffffff, 3);
keyLight.position.set(2, 3, 4);
scene.add(keyLight);

const redLight = new THREE.DirectionalLight(0x9a263b, 1.5);
redLight.position.set(-3, 1, -2);
scene.add(redLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 0.7);
fillLight.position.set(-2, -1, 3);
scene.add(fillLight);

/* DRACO */
const draco = new DRACOLoader();
draco.setDecoderPath(
  "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
);

const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

const clock = new THREE.Clock();

let shirt = null;
let baseScale = 1;
let baseY = 0;

let scrollTarget = 0;
let scrollCurrent = 0;

/* CHARGEMENT DU MODÈLE */
loader.load(
  "./shift.glb",
  (gltf) => {
    shirt = gltf.scene;

    const bounds = new THREE.Box3().setFromObject(shirt);
    const size = bounds.getSize(new THREE.Vector3());
    const center = bounds.getCenter(new THREE.Vector3());

    if (!size.y || !Number.isFinite(size.y)) {
      console.error("Dimensions du modèle invalides.");
      return;
    }

    /* ÉCHELLE INITIALE PLUS PETITE */
    baseScale = 1.95 / size.y;
    shirt.scale.setScalar(baseScale);

    shirt.position.set(
      -center.x * baseScale,
      -center.y * baseScale,
      -center.z * baseScale
    );

    baseY = shirt.position.y;

    /* VENT TRÈS RÉDUIT */
    shirt.traverse((object) => {
      if (!object.isMesh) return;

      const materials = Array.isArray(object.material)
        ? object.material
        : [object.material];

      materials.forEach((material) => {
        const uniforms = {
          uTime: { value: 0 },
          uMinY: { value: bounds.min.y },
          uInvHeight: { value: 1 / size.y },
          uHeight: { value: size.y }
        };

        material.onBeforeCompile = (shader) => {
          shader.uniforms.uTime = uniforms.uTime;
          shader.uniforms.uMinY = uniforms.uMinY;
          shader.uniforms.uInvHeight = uniforms.uInvHeight;
          shader.uniforms.uHeight = uniforms.uHeight;

          material.userData.ekdysShader = shader;

          shader.vertexShader = shader.vertexShader.replace(
            "#include <common>",
            `#include <common>
            uniform float uTime;
            uniform float uMinY;
            uniform float uInvHeight;
            uniform float uHeight;`
          );

          shader.vertexShader = shader.vertexShader.replace(
            "#include <begin_vertex>",
            `#include <begin_vertex>

            float h = clamp(
              (position.y - uMinY) * uInvHeight,
              0.0,
              1.0
            );

            float hem = 1.0 - smoothstep(0.10, 0.50, h);
            float side = smoothstep(
              0.15,
              0.85,
              abs(position.x) / max(uHeight * 0.25, 0.001)
            );

            float weight = max(hem, side * 0.35);

            float wave = sin(
              uTime * 1.1 +
              position.y * 2.0 +
              position.x * 1.5
            );

            float wave2 = sin(
              uTime * 0.8 +
              position.y * 1.4 -
              position.x * 1.5
            );

            transformed.x += wave * weight * uHeight * 0.006;
            transformed.z += wave2 * weight * uHeight * 0.004;
            `
          );

          /* ROUGE */
          shader.fragmentShader = shader.fragmentShader.replace(
            "#include <color_fragment>",
            `#include <color_fragment>

            float redDifference =
              diffuseColor.r -
              max(diffuseColor.g, diffuseColor.b);

            float redMask = smoothstep(
              0.025,
              0.16,
              redDifference
            );

            diffuseColor.rgb *= mix(
              vec3(1.0),
              vec3(2.0, 0.35, 0.35),
              redMask
            );

            diffuseColor.rgb = mix(
              diffuseColor.rgb,
              vec3(1.0, 0.005, 0.015),
              redMask * 0.30
            );
            `
          );
        };

        material.customProgramCacheKey = () =>
          "ekdys-shift-wind-red-v7";

        material.needsUpdate = true;
      });
    });

    scene.add(shirt);
    console.log("SHIFT chargé.");
  },
  undefined,
  (error) => {
    console.error("Erreur de chargement du GLB :", error);
  }
);

/* RÉCEPTION DU SCROLL */
window.addEventListener("message", (event) => {
  if (event.source !== window.parent) return;
  if (event.data?.type !== "EKDYS_SCROLL") return;

  scrollTarget = THREE.MathUtils.clamp(
    Number(event.data.progress) || 0,
    0,
    1
  );
});

/* REDIMENSIONNEMENT */
function resize() {
  const w = container.clientWidth;
  const h = container.clientHeight;

  if (!w || !h) return;

  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

new ResizeObserver(resize).observe(container);

/* ANIMATION */
renderer.setAnimationLoop(() => {
  const time = clock.getElapsedTime();

  scrollCurrent += (scrollTarget - scrollCurrent) * 0.10;

  if (shirt) {
    /* ACTUALISATION DU LÉGER VENT */
    shirt.traverse((object) => {
      if (!object.isMesh) return;

      const materials = Array.isArray(object.material)
        ? object.material
        : [object.material];

      materials.forEach((material) => {
        const shader = material.userData.ekdysShader;
        if (shader) shader.uniforms.uTime.value = time;
      });
    });

    /*
      SCROLL BAS :
      rotation vers la gauche + zoom

      SCROLL HAUT :
      retour inverse + dézoom
    */

    shirt.rotation.y = -scrollCurrent * Math.PI * 1.5;

    shirt.rotation.x = scrollCurrent * 0.12;

    shirt.rotation.z = -scrollCurrent * 0.035;

    /* ZOOM PROGRESSIF */
    const zoom = 1 + scrollCurrent * 0.55;
    shirt.scale.setScalar(baseScale * zoom);

    /* LÉGER DÉPLACEMENT */
    shirt.position.y = baseY - scrollCurrent * 0.08;
  }

  renderer.render(scene, camera);
});
</script>
</body>
</html>
