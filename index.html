
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EKDYS SHIFT 3D</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent !important;
  border: 0 !important;
  outline: 0 !important;
}

#shift-scene {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  border: 0;
  outline: 0;
  touch-action: none;
}

/* IMAGE DE FOND */
#shift-background {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: url("./fond-ekdys.png") center center / cover no-repeat;
  border: 0;
  outline: 0;
  pointer-events: none;
}

/* CANVAS */
#shift-scene canvas {
  position: absolute;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  display: block;
  border: 0;
  outline: 0;
  touch-action: none;
  cursor: grab;
}

#shift-scene canvas:active {
  cursor: grabbing;
}

#shift-loading {
  position: absolute;
  z-index: 2;
  inset: 0;
  display: grid;
  place-items: center;
  color: white;
  font: 12px Arial, sans-serif;
  letter-spacing: 2px;
  pointer-events: none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="shift-scene">
  <div id="shift-background"></div>
  <div id="shift-loading">EKDYS — CHARGEMENT</div>
</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

const container = document.querySelector("#shift-scene");
const loading = document.querySelector("#shift-loading");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  32,
  container.clientWidth / container.clientHeight,
  0.01,
  100
);
camera.position.set(0, 0, 4.5);

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

container.appendChild(renderer.domElement);

/* ÉCLAIRAGE */
scene.add(new THREE.HemisphereLight(0xffffff, 0x171717, 2));

const keyLight = new THREE.DirectionalLight(0xffffff, 3);
keyLight.position.set(2, 3, 4);
scene.add(keyLight);

const redLight = new THREE.DirectionalLight(0x9a263b, 1.5);
redLight.position.set(-3, 1, -2);
scene.add(redLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 0.7);
fillLight.position.set(-2, -1, 3);
scene.add(fillLight);

/* DRACO */
const draco = new DRACOLoader();
draco.setDecoderPath(
  "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
);

const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

const clock = new THREE.Clock();

let shirt = null;
let baseScale = 1;
let baseY = 0;

let scrollTarget = 0;
let scrollCurrent = 0;

/* ROTATION MANUELLE */
let dragging = false;
let lastX = 0;
let lastY = 0;
let manualY = 0;
let manualX = 0;

const canvas = renderer.domElement;

canvas.addEventListener("pointerdown", (e) => {
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
  canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointermove", (e) => {
  if (!dragging) return;

  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;

  lastX = e.clientX;
  lastY = e.clientY;

  manualY += dx * 0.012;
  manualX += dy * 0.012;

  manualX = THREE.MathUtils.clamp(manualX, -1.1, 1.1);
});

function stopDragging() {
  dragging = false;
}

canvas.addEventListener("pointerup", stopDragging);
canvas.addEventListener("pointercancel", stopDragging);
canvas.addEventListener("lostpointercapture", stopDragging);

/* CHARGEMENT DU MODÈLE */
loader.load(
  "./shift.glb",
  (gltf) => {
    shirt = gltf.scene;

    const bounds = new THREE.Box3().setFromObject(shirt);
    const size = bounds.getSize(new THREE.Vector3());
    const center = bounds.getCenter(new THREE.Vector3());

    if (!size.y || !Number.isFinite(size.y)) {
      loading.textContent = "MODÈLE 3D INVALIDE";
      return;
    }

    baseScale = 2.35 / size.y;
    shirt.scale.setScalar(baseScale);

    shirt.position.set(
      -center.x * baseScale,
      -center.y * baseScale,
      -center.z * baseScale
    );

    baseY = shirt.position.y;

    /* VENT ET COULEUR */
    shirt.traverse((object) => {
      if (!object.isMesh) return;

      object.frustumCulled = false;

      const materials = Array.isArray(object.material)
        ? object.material
        : [object.material];

      materials.forEach((material) => {
        const uniforms = {
          uTime: { value: 0 },
          uMinY: { value: bounds.min.y },
          uInvHeight: { value: 1 / size.y },
          uHeight: { value: size.y }
        };

        material.onBeforeCompile = (shader) => {
          shader.uniforms.uTime = uniforms.uTime;
          shader.uniforms.uMinY = uniforms.uMinY;
          shader.uniforms.uInvHeight = uniforms.uInvHeight;
          shader.uniforms.uHeight = uniforms.uHeight;

          material.userData.ekdysShader = shader;

          shader.vertexShader = shader.vertexShader.replace(
            "#include <common>",
            `#include <common>
            uniform float uTime;
            uniform float uMinY;
            uniform float uInvHeight;
            uniform float uHeight;`
          );

          shader.vertexShader = shader.vertexShader.replace(
            "#include <begin_vertex>",
            `#include <begin_vertex>

            float h = clamp(
              (position.y - uMinY) * uInvHeight,
              0.0,
              1.0
            );

            float hem = 1.0 - smoothstep(0.10, 0.50, h);
            float side = smoothstep(
              0.15,
              0.85,
              abs(position.x) / max(uHeight * 0.25, 0.001)
            );

            float weight = max(hem, side * 0.55);

            float wave1 = sin(
              uTime * 2.2 + position.y * 3.0 + position.x * 2.0
            );

            float wave2 = sin(
              uTime * 1.7 + position.y * 2.0 - position.x * 2.5
            );

            float wave3 = sin(
              uTime * 1.4 + position.x * 3.0 + position.y
            );

            /* VENT RENFORCÉ */
            transformed.x += wave1 * weight * uHeight * 0.055;
            transformed.z += wave2 * weight * uHeight * 0.045;
            transformed.y += wave3 * weight * uHeight * 0.018;
            `
          );

          shader.fragmentShader = shader.fragmentShader.replace(
            "#include <color_fragment>",
            `#include <color_fragment>

            float redDifference =
              diffuseColor.r - max(
                diffuseColor.g,
                diffuseColor.b
              );

            float redMask = smoothstep(
              0.025,
              0.16,
              redDifference
            );

            diffuseColor.rgb *= mix(
              vec3(1.0),
              vec3(2.0, 0.35, 0.35),
              redMask
            );

            diffuseColor.rgb = mix(
              diffuseColor.rgb,
              vec3(1.0, 0.005, 0.015),
              redMask * 0.30
            );
            `
          );
        };

        material.customProgramCacheKey = () =>
          "ekdys-shift-wind-red-v6";

        material.needsUpdate = true;
      });
    });

    scene.add(shirt);
    loading.style.display = "none";

    console.log("SHIFT chargé :", size);
  },
  (progress) => {
    if (progress.total) {
      loading.textContent =
        "EKDYS — " +
        Math.round(progress.loaded / progress.total * 100) +
        "%";
    }
  },
  (error) => {
    loading.textContent = "ERREUR DE CHARGEMENT DU T-SHIRT";
    console.error(error);
  }
);

/* RÉCEPTION DU SCROLL DEPUIS CARRD */
window.addEventListener("message", (event) => {
  if (event.source !== window.parent) return;
  if (event.data?.type !== "EKDYS_SCROLL") return;

  scrollTarget = THREE.MathUtils.clamp(
    Number(event.data.progress) || 0,
    0,
    1
  );
});

/* REDIMENSIONNEMENT */
function resize() {
  const w = container.clientWidth;
  const h = container.clientHeight;

  if (!w || !h) return;

  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
}

new ResizeObserver(resize).observe(container);

/* ANIMATION */
renderer.setAnimationLoop(() => {
  const time = clock.getElapsedTime();

  scrollCurrent += (scrollTarget - scrollCurrent) * 0.12;

  if (shirt) {
    shirt.traverse((object) => {
      if (!object.isMesh) return;

      const materials = Array.isArray(object.material)
        ? object.material
        : [object.material];

      materials.forEach((material) => {
        const shader = material.userData.ekdysShader;
        if (shader) shader.uniforms.uTime.value = time;
      });
    });

    /* ROTATION AUTOMATIQUE : JUSQU'À PRESQUE UN TOUR */
    shirt.rotation.y =
      manualY +
      scrollCurrent * Math.PI * 1.8 +
      Math.sin(time * 0.4) * 0.025;

    shirt.rotation.x =
      manualX +
      scrollCurrent * 0.65 +
      Math.sin(time * 0.3) * 0.015;

    shirt.rotation.z =
      Math.sin(time * 0.5) * 0.015 +
      Math.sin(scrollCurrent * Math.PI) * 0.12;

    /* DÉPLACEMENTS */
    shirt.position.x =
      Math.sin(scrollCurrent * Math.PI * 2) * 0.35;

    shirt.position.y =
      baseY +
      Math.sin(time * 0.8) * 0.025 -
      scrollCurrent * 0.18;

    shirt.position.z = scrollCurrent * 0.30;

    /* ZOOM LIMITÉ POUR ÉVITER LA SORTIE DU CADRE */
    const zoom = 1 + scrollCurrent * 0.16;
    shirt.scale.setScalar(baseScale * zoom);
  }

  renderer.render(scene, camera);
});
</script>
</body>
</html>
