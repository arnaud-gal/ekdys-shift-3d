
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKDYS — SHIFT 3D</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent;
  border: 0;
}

#shift-scene {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

#shift-background {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: url("./fond-ekdys.png") center / cover no-repeat;
  pointer-events: none;
}

#shift-scene canvas {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none !important;
  touch-action: none;
  user-select: none;
}

#shift-loading {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: grid;
  place-items: center;
  color: #aaa;
  font: 12px Arial, sans-serif;
  letter-spacing: 2px;
  pointer-events: none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="shift-scene">
  <div id="shift-background"></div>
  <div id="shift-loading">EKDYS — LOADING</div>
</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

/* =========================================
   SCÈNE
========================================= */

const container = document.querySelector("#shift-scene");
const loading = document.querySelector("#shift-loading");

const scene = new THREE.Scene();

/* Brume noire extrêmement légère */
scene.fog = new THREE.FogExp2(0x080808, 0.009);

/* =========================================
   CAMÉRA
========================================= */

const camera = new THREE.PerspectiveCamera(
  32,
  container.clientWidth / container.clientHeight,
  0.01,
  100
);

/* Plus loin au départ pour garder le T-shirt entier */
const initialCameraZ = 6.4;
camera.position.set(0, 0, initialCameraZ);

/* =========================================
   RENDERER
========================================= */

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.setClearColor(0x000000, 0);

renderer.domElement.style.pointerEvents = "none";
container.appendChild(renderer.domElement);

/* =========================================
   ÉCLAIRAGE
========================================= */

/* Lumière ambiante */
scene.add(
  new THREE.HemisphereLight(0xffffff, 0x29252a, 1.65)
);

/* Lumière principale : hautes lumières */
const keyLight = new THREE.DirectionalLight(0xffffff, 3.2);
keyLight.position.set(1.5, 4, 4);
scene.add(keyLight);

/* Lumière latérale pour révéler les reliefs */
const sideLight = new THREE.DirectionalLight(0xe5e8f0, 1.5);
sideLight.position.set(-4, 1.5, 2);
scene.add(sideLight);

/* Contre-jour bordeaux */
const rimLight = new THREE.DirectionalLight(0x9d263f, 1.0);
rimLight.position.set(-3, 1, -3);
scene.add(rimLight);

/* Remplissage frontal */
const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
fillLight.position.set(0, -1, 5);
scene.add(fillLight);

/* =========================================
   CHARGEMENT DRACO + GLB
========================================= */

const dracoLoader = new DRACOLoader();

dracoLoader.setDecoderPath(
  "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
);

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

const clock = new THREE.Clock();

let shirt = null;
let baseScale = 1;
let baseY = 0;
let modelCenter = new THREE.Vector3();
let modelSize = new THREE.Vector3();

let scrollTarget = 0;
let scrollCurrent = 0;

/* =========================================
   CALCUL DU CADRAGE RESPONSIVE
========================================= */

function updateShirtFit() {
  if (!shirt || modelSize.y <= 0) return;

  const aspect = container.clientWidth / container.clientHeight;

  const visibleHeight =
    2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))
    * camera.position.z;

  const visibleWidth = visibleHeight * aspect;

  /*
   * Réserve de l'espace autour du T-shirt :
   * 78 % de la hauteur et de la largeur disponibles.
   */
  const scaleByHeight = (visibleHeight * 0.78) / modelSize.y;
  const scaleByWidth = (visibleWidth * 0.78) / modelSize.x;

  baseScale = Math.min(scaleByHeight, scaleByWidth);

  shirt.scale.setScalar(baseScale);

  shirt.position.set(
    -modelCenter.x * baseScale,
    -modelCenter.y * baseScale,
    -modelCenter.z * baseScale
  );

  baseY = shirt.position.y;
}

/* =========================================
   CHARGEMENT DU MODÈLE
========================================= */

loader.load(
  "./shift.glb",

  (gltf) => {
    try {
      shirt = gltf.scene;

      const bounds = new THREE.Box3().setFromObject(shirt);
      modelSize = bounds.getSize(new THREE.Vector3());
      modelCenter = bounds.getCenter(new THREE.Vector3());

      if (
        !Number.isFinite(modelSize.y) ||
        modelSize.y <= 0 ||
        modelSize.x <= 0
      ) {
        throw new Error("Dimensions du modèle 3D invalides.");
      }

      shirt.traverse((object) => {
        if (!object.isMesh) return;

        object.frustumCulled = false;

        const materials = Array.isArray(object.material)
          ? object.material
          : [object.material];

        materials.forEach((material) => {

          /*
           * Saturation augmentée de 50 %.
           * Les textures conservent leurs détails.
           */
          material.onBeforeCompile = (shader) => {

            shader.fragmentShader =
              shader.fragmentShader.replace(
                "#include <common>",
                `#include <common>`
              );

            shader.fragmentShader =
              shader.fragmentShader.replace(
                "#include <color_fragment>",
                `#include <color_fragment>

                float ekdysLuma = dot(
                  diffuseColor.rgb,
                  vec3(0.2126, 0.7152, 0.0722)
                );

                diffuseColor.rgb = mix(
                  vec3(ekdysLuma),
                  diffuseColor.rgb,
                  1.5
                );

                diffuseColor.rgb *= 1.10;
                `
              );
          };

          material.customProgramCacheKey = () =>
            "ekdys-color-boost-150";

          material.needsUpdate = true;

          /*
           * Vent discret : aucune modification
           * de la forme générale du vêtement.
           */
          const windUniforms = {
            uTime: { value: 0 },
            uMinY: { value: bounds.min.y },
            uInvHeight: {
              value: 1 / Math.max(modelSize.y, 0.001)
            },
            uHeight: { value: modelSize.y }
          };

          const previousCompile = material.onBeforeCompile;

          material.onBeforeCompile = (shader, renderer) => {

            previousCompile(shader, renderer);

            shader.uniforms.uTime = windUniforms.uTime;
            shader.uniforms.uMinY = windUniforms.uMinY;
            shader.uniforms.uInvHeight = windUniforms.uInvHeight;
            shader.uniforms.uHeight = windUniforms.uHeight;

            material.userData.windShader = shader;

            shader.vertexShader = shader.vertexShader.replace(
              "#include <common>",
              `#include <common>
              uniform float uTime;
              uniform float uMinY;
              uniform float uInvHeight;
              uniform float uHeight;`
            );

            shader.vertexShader = shader.vertexShader.replace(
              "#include <begin_vertex>",
              `#include <begin_vertex>

              float heightRatio = clamp(
                (position.y - uMinY) * uInvHeight,
                0.0,
                1.0
              );

              float hem = 1.0 - smoothstep(
                0.12, 0.48, heightRatio
              );

              float sides = smoothstep(
                0.25, 0.85,
                abs(position.x) / max(uHeight * 0.25, 0.001)
              );

              float windWeight = max(hem, sides * 0.45);

              float wave = sin(
                uTime * 1.1 +
                position.y * 3.0 +
                position.x * 2.0
              );

              float wave2 = sin(
                uTime * 0.7 +
                position.y * 1.7 -
                position.x * 2.4
              );

              transformed.x +=
                wave * windWeight * uHeight * 0.002;

              transformed.z +=
                wave2 * windWeight * uHeight * 0.0015;
              `
            );
          };

          material.customProgramCacheKey = () =>
            "ekdys-shift-color-wind-v4";
        });
      });

      scene.add(shirt);
      updateShirtFit();

      loading.style.display = "none";

      console.log("EKDYS SHIFT : modèle chargé et cadré.");

    } catch (error) {
      loading.textContent = "ERREUR : " + error.message;
      console.error("Erreur modèle :", error);
    }
  },

  (progress) => {
    if (progress.total > 0) {
      loading.textContent =
        "EKDYS — LOADING " +
        Math.round(progress.loaded / progress.total * 100) + "%";
    }
  },

  (error) => {
    loading.textContent = "ERREUR DE CHARGEMENT DU MODÈLE 3D";
    console.error("Erreur GLB :", error);
  }
);

/* =========================================
   RÉCEPTION DU SCROLL CARRD
========================================= */

window.addEventListener("message", (event) => {
  if (
    event.source === window.parent &&
    event.data?.type === "EKDYS_SCROLL"
  ) {
    scrollTarget = THREE.MathUtils.clamp(
      Number(event.data.progress) || 0,
      0,
      1
    );
  }
});

/* =========================================
   REDIMENSIONNEMENT
========================================= */

function resize() {
  const width = container.clientWidth;
  const height = container.clientHeight;

  if (!width || !height) return;

  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  renderer.setSize(width, height);

  /*
   * Recalcule la taille du T-shirt
   * selon les dimensions réelles de la fenêtre.
   */
  updateShirtFit();
}

new ResizeObserver(resize).observe(container);

/* =========================================
   ANIMATION ET SCROLL
========================================= */

renderer.setAnimationLoop(() => {
  const time = clock.getElapsedTime();

  scrollCurrent += (scrollTarget - scrollCurrent) * 0.075;

  if (shirt) {

    /* Mise à jour du vent */
    shirt.traverse((object) => {
      if (!object.isMesh) return;

      const materials = Array.isArray(object.material)
        ? object.material
        : [object.material];

      materials.forEach((material) => {
        const shader = material.userData.windShader;

        if (shader) {
          shader.uniforms.uTime.value = time;
        }
      });
    });

    /*
     * ROTATION AU SCROLL
     * Le T-shirt pivote progressivement vers la gauche.
     * Rotation modérée, mais clairement visible.
     */
    shirt.rotation.y = -scrollCurrent * 0.085;
    shirt.rotation.x = scrollCurrent * 0.012;
    shirt.rotation.z = -scrollCurrent * 0.004;

    /*
     * ZOOM PROGRESSIF
     * Petit et entier au départ.
     * Plus proche et plus grand en descendant.
     */
    const zoom = 1 + scrollCurrent * 0.38;

    shirt.scale.setScalar(baseScale * zoom);

    /* Déplacement vers le spectateur */
    shirt.position.z = scrollCurrent * 0.25;
    shirt.position.y = baseY;

    camera.position.z = initialCameraZ - scrollCurrent * 0.25;
  }

  renderer.render(scene, camera);
});

</script>
</body>
</html>
