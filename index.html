
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKDYS — SHIFT 3D</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  border: 0;
  outline: 0;
}

#shift-scene {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  border: 0;
  outline: 0;
}

/* Image de fond fixe */
#shift-background {
  position: absolute;
  inset: 0;
  z-index: 0;
  background-image: url("./fond-ekdys.png");
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  pointer-events: none;
}

/* Le canvas ne reçoit aucune interaction */
#shift-scene canvas {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none !important;
  touch-action: none;
  user-select: none;
  border: 0;
  outline: 0;
}

#shift-loading {
  position: absolute;
  z-index: 2;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 20px;
  color: #aaa;
  font: 12px Arial, sans-serif;
  letter-spacing: 2px;
  text-align: center;
  white-space: pre-wrap;
  pointer-events: none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="shift-scene">
  <div id="shift-background"></div>
  <div id="shift-loading">EKDYS — LOADING</div>
</div>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

const container = document.querySelector("#shift-scene");
const loading = document.querySelector("#shift-loading");

const scene = new THREE.Scene();

/* CAMÉRA */

const camera = new THREE.PerspectiveCamera(
  32,
  container.clientWidth / container.clientHeight,
  0.01,
  100
);

const initialCameraZ = 4.5;
camera.position.set(0, 0, initialCameraZ);

/* RENDERER */

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
renderer.setClearColor(0x000000, 0);

renderer.domElement.style.pointerEvents = "none";
container.appendChild(renderer.domElement);

/* LUMIÈRES */

scene.add(new THREE.HemisphereLight(0xffffff, 0x171717, 1.1));

const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
keyLight.position.set(2, 3, 4);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x9a263b, 0.65);
rimLight.position.set(-3, 1, -2);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 0.35);
fillLight.position.set(-2, -1, 3);
scene.add(fillLight);

/* CHARGEMENT DRACO */

const dracoLoader = new DRACOLoader();

dracoLoader.setDecoderPath(
  "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
);

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

/* VARIABLES */

const clock = new THREE.Clock();

let shirt = null;
let baseScale = 1;
let baseY = 0;

let scrollTarget = 0;
let scrollCurrent = 0;

/* CHARGEMENT DU T-SHIRT */

loader.load(
  "./shift.glb",

  (gltf) => {

    try {

      shirt = gltf.scene;

      const bounds = new THREE.Box3().setFromObject(shirt);
      const size = bounds.getSize(new THREE.Vector3());
      const center = bounds.getCenter(new THREE.Vector3());

      if (!Number.isFinite(size.y) || size.y <= 0) {
        throw new Error("Dimensions du modèle 3D invalides.");
      }

      /*
       * T-SHIRT PLUS PETIT AU DÉPART
       * Il doit être entièrement visible en haut de page.
       */

      baseScale = 1.85 / Math.max(size.y, 0.001);

      shirt.scale.setScalar(baseScale);

      shirt.position.set(
        -center.x * baseScale,
        -center.y * baseScale,
        -center.z * baseScale
      );

      baseY = shirt.position.y;

      /* VENT TRÈS DISCRET */

      shirt.traverse((object) => {

        if (!object.isMesh) return;

        object.frustumCulled = false;

        const materialList = Array.isArray(object.material)
          ? object.material
          : [object.material];

        materialList.forEach((material) => {

          const windUniforms = {
            uTime: { value: 0 },
            uMinY: { value: bounds.min.y },
            uInvHeight: {
              value: 1 / Math.max(size.y, 0.001)
            },
            uHeight: { value: size.y }
          };

          material.onBeforeCompile = (shader) => {

            shader.uniforms.uTime = windUniforms.uTime;
            shader.uniforms.uMinY = windUniforms.uMinY;
            shader.uniforms.uInvHeight = windUniforms.uInvHeight;
            shader.uniforms.uHeight = windUniforms.uHeight;

            material.userData.windShader = shader;

            shader.vertexShader = shader.vertexShader.replace(
              "#include <common>",
              `#include <common>
              uniform float uTime;
              uniform float uMinY;
              uniform float uInvHeight;
              uniform float uHeight;`
            );

            shader.vertexShader = shader.vertexShader.replace(
              "#include <begin_vertex>",
              `#include <begin_vertex>

              float heightRatio = clamp(
                (position.y - uMinY) * uInvHeight,
                0.0,
                1.0
              );

              float hem = 1.0 - smoothstep(
                0.12,
                0.48,
                heightRatio
              );

              float sides = smoothstep(
                0.25,
                0.85,
                abs(position.x) /
                max(uHeight * 0.25, 0.001)
              );

              float windWeight = max(
                hem,
                sides * 0.45
              );

              float wave = sin(
                uTime * 1.1 +
                position.y * 3.0 +
                position.x * 2.0
              );

              float wave2 = sin(
                uTime * 0.7 +
                position.y * 1.7 -
                position.x * 2.4
              );

              transformed.x +=
                wave * windWeight * uHeight * 0.002;

              transformed.z +=
                wave2 * windWeight * uHeight * 0.0015;
              `
            );
          };

          material.customProgramCacheKey = () =>
            "ekdys-shift-wind-v2";

          material.needsUpdate = true;

        });
      });

      scene.add(shirt);

      loading.style.display = "none";

      console.log("EKDYS : modèle SHIFT chargé.");

    } catch (error) {

      loading.textContent =
        "ERREUR DE CONFIGURATION : " + error.message;

      console.error("Erreur modèle :", error);

    }

  },

  (progress) => {

    if (progress.total > 0) {
      const percent = Math.round(
        (progress.loaded / progress.total) * 100
      );

      loading.textContent = "EKDYS — LOADING " + percent + "%";
    }

  },

  (error) => {

    loading.textContent =
      "ERREUR DE CHARGEMENT : " +
      (error.message || "Impossible de lire le modèle 3D.");

    console.error("Erreur GLB :", error);

  }
);

/* RÉCEPTION DU SCROLL DE CARRD */

window.addEventListener("message", (event) => {

  if (event.data?.type === "EKDYS_SCROLL") {

    scrollTarget = THREE.MathUtils.clamp(
      Number(event.data.progress) || 0,
      0,
      1
    );

  }

});

/* REDIMENSIONNEMENT */

function resize() {

  const width = container.clientWidth;
  const height = container.clientHeight;

  if (!width || !height) return;

  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  renderer.setSize(width, height);

}

new ResizeObserver(resize).observe(container);

/* ANIMATION */

renderer.setAnimationLoop(() => {

  const time = clock.getElapsedTime();

  /* Lissage du mouvement au scroll */
  scrollCurrent += (scrollTarget - scrollCurrent) * 0.075;

  if (shirt) {

    /* Actualisation du vent */

    shirt.traverse((object) => {

      if (!object.isMesh) return;

      const materials = Array.isArray(object.material)
        ? object.material
        : [object.material];

      materials.forEach((material) => {

        const shader = material.userData.windShader;

        if (shader) {
          shader.uniforms.uTime.value = time;
        }

      });

    });

    /*
     * ROTATION :
     * Pas de rotation automatique.
     * Rotation au scroll divisée par 20.
     */

    shirt.rotation.set(0, 0, 0);

    shirt.rotation.y = scrollCurrent * 0.003;

    /*
     * ZOOM PROGRESSIF :
     * En haut : T-shirt éloigné et entièrement visible.
     * En bas : T-shirt nettement plus grand.
     */

    const zoom = 1 + scrollCurrent * 0.55;

    shirt.scale.setScalar(baseScale * zoom);

    /*
     * RAPPROCHEMENT :
     * Le T-shirt avance vers la caméra au fil du scroll.
     */

    shirt.position.z = scrollCurrent * 0.55;

    /* Position verticale stable */

    shirt.position.y = baseY;

    /* Caméra légèrement rapprochée en complément */

    camera.position.z = initialCameraZ - scrollCurrent * 0.25;

  }

  renderer.render(scene, camera);

});

</script>
</body>
</html>
