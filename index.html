
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKDYS — SHIFT 3D</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080707;
}

#shift-scene {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;

  /* FOND EKDYS */
  background-color: #080707;
  background-image: url("https://arnaud-gal.github.io/ekdys-shift-3d/fond-ekdys.png");
  background-position: center center;
  background-size: cover;
  background-repeat: no-repeat;
}

#shift-scene canvas {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
  touch-action: pan-y;
}

#shift-scene canvas:active {
  cursor: grabbing;
}

#shift-loading {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: grid;
  place-items: center;
  color: #aaa;
  font: 12px Arial, sans-serif;
  letter-spacing: 2px;
  text-align: center;
  pointer-events: none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="shift-scene">
  <div id="shift-loading">EKDYS — LOADING</div>
</div>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

// ==========================================
// CONFIGURATION
// ==========================================

const container = document.querySelector("#shift-scene");
const loading = document.querySelector("#shift-loading");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  32,
  container.clientWidth / container.clientHeight,
  0.01,
  100
);

camera.position.set(0, 0, 4.8);

// ==========================================
// RENDERER
// ==========================================

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1, 1.5)
);

renderer.setSize(
  container.clientWidth,
  container.clientHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.setClearColor(0x000000, 0);

container.appendChild(renderer.domElement);

// ==========================================
// ÉCLAIRAGE
// ==========================================

scene.add(
  new THREE.HemisphereLight(0xffffff, 0x171717, 2)
);

const keyLight = new THREE.DirectionalLight(0xffffff, 3.2);
keyLight.position.set(2, 3, 4);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0xa51d36, 1.8);
rimLight.position.set(-3, 1, -2);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
fillLight.position.set(-2, -1, 3);
scene.add(fillLight);

// ==========================================
// DRACO
// ==========================================

const dracoLoader = new DRACOLoader();

dracoLoader.setDecoderPath(
  "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
);

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

// ==========================================
// VARIABLES
// ==========================================

const clock = new THREE.Clock();

let shirt = null;

let baseScale = 1;
let baseX = 0;
let baseY = 0;
let baseZ = 0;

let scrollTarget = 0;
let scrollCurrent = 0;

let manualRotationY = 0;
let manualRotationX = 0;

let dragging = false;
let lastPointerX = 0;
let lastPointerY = 0;

// ==========================================
// MATÉRIAUX : VENT + ROUGE
// ==========================================

function prepareMaterial(originalMaterial, geometryBounds) {

  const material = originalMaterial.clone();

  const size = geometryBounds.getSize(
    new THREE.Vector3()
  );

  const center = geometryBounds.getCenter(
    new THREE.Vector3()
  );

  const height = Math.max(size.y, 0.001);
  const halfWidth = Math.max(size.x * 0.5, 0.001);

  const uniforms = {
    uTime: { value: 0 },
    uMinY: { value: geometryBounds.min.y },
    uInvHeight: { value: 1 / height },
    uHeight: { value: height },
    uCenterX: { value: center.x },
    uHalfWidth: { value: halfWidth }
  };

  material.onBeforeCompile = (shader) => {

    Object.assign(shader.uniforms, uniforms);

    material.userData.windShader = shader;

    // UNIFORMES
    shader.vertexShader = shader.vertexShader.replace(
      "#include <common>",
      `#include <common>

      uniform float uTime;
      uniform float uMinY;
      uniform float uInvHeight;
      uniform float uHeight;
      uniform float uCenterX;
      uniform float uHalfWidth;
      `
    );

    // VENT : DÉFORMATION DU TISSU
    shader.vertexShader = shader.vertexShader.replace(
      "#include <begin_vertex>",
      `#include <begin_vertex>

      float h = clamp(
        (position.y - uMinY) * uInvHeight,
        0.0,
        1.0
      );

      // Bas du vêtement
      float hem = 1.0 - smoothstep(0.05, 0.60, h);

      // Bords du vêtement
      float edge = smoothstep(
        0.15,
        0.85,
        abs(position.x - uCenterX) / uHalfWidth
      );

      // Répartition du vent
      float weight = max(
        hem * 1.0,
        edge * 0.85
      );

      // Rafales progressives
      float gust = 0.72 + 0.28 * sin(
        uTime * 0.8 + position.y * 1.7
      );

      // Grandes ondulations
      float wave1 = sin(
        uTime * 2.4 +
        position.y * 4.0 +
        position.x * 3.2
      );

      float wave2 = sin(
        uTime * 1.8 -
        position.y * 3.4 +
        position.x * 4.5
      );

      // Petites ondulations irrégulières
      float wave3 = sin(
        uTime * 3.1 +
        position.x * 5.0 -
        position.y * 2.0
      );

      float wave4 = sin(
        uTime * 1.3 +
        position.y * 5.0 +
        position.x * 1.5
      );

      // Mouvement latéral
      transformed.x +=
        wave1 * weight * uHeight * 0.038 * gust;

      // Mouvement avant / arrière
      transformed.z +=
        wave2 * weight * uHeight * 0.032 * gust;

      // Soulèvement du tissu
      transformed.y +=
        wave3 * weight * uHeight * 0.012 * gust;

      // Ondulation secondaire
      transformed.z +=
        wave4 * weight * uHeight * 0.012;
      `
    );

    // ROUGE PLUS VIF
    shader.fragmentShader = shader.fragmentShader.replace(
      "#include <color_fragment>",
      `#include <color_fragment>

      // Détection des zones rouges
      float redDifference =
        diffuseColor.r -
        max(diffuseColor.g, diffuseColor.b);

      float redMask = smoothstep(
        0.015,
        0.12,
        redDifference
      );

      // Saturation renforcée
      float grayValue = dot(
        diffuseColor.rgb,
        vec3(0.2126, 0.7152, 0.0722)
      );

      vec3 saturatedColor = mix(
        vec3(grayValue),
        diffuseColor.rgb,
        1.75
      );

      // Rouge plus lumineux et plus franc
      vec3 vividRed = vec3(
        min(saturatedColor.r * 1.55 + 0.035, 1.0),
        saturatedColor.g * 0.68,
        saturatedColor.b * 0.68
      );

      diffuseColor.rgb = mix(
        diffuseColor.rgb,
        vividRed,
        redMask
      );
      `
    );

  };

  material.customProgramCacheKey = () =>
    "ekdys-shift-wind-red-v3";

  material.needsUpdate = true;

  return material;
}

// ==========================================
// CHARGEMENT DU MODÈLE
// ==========================================

loader.load(
  "./shift.glb",

  (gltf) => {

    try {

      shirt = gltf.scene;

      const bounds = new THREE.Box3().setFromObject(shirt);
      const size = bounds.getSize(new THREE.Vector3());
      const center = bounds.getCenter(new THREE.Vector3());

      if (!Number.isFinite(size.y) || size.y <= 0) {
        throw new Error("Dimensions du modèle invalides.");
      }

      // TAILLE ET CENTRAGE
      baseScale = 1.75 / size.y;

      shirt.scale.setScalar(baseScale);

      baseX = -center.x * baseScale;
      baseY = -center.y * baseScale;
      baseZ = -center.z * baseScale;

      shirt.position.set(baseX, baseY, baseZ);

      // PRÉPARATION DES MESHES
      shirt.traverse((object) => {

        if (!object.isMesh) return;

        object.frustumCulled = false;

        object.geometry.computeBoundingBox();

        const materials = Array.isArray(object.material)
          ? object.material
          : [object.material];

        const prepared = materials.map((material) =>
          prepareMaterial(
            material,
            object.geometry.boundingBox
          )
        );

        object.material = Array.isArray(object.material)
          ? prepared
          : prepared[0];

      });

      scene.add(shirt);

      loading.style.display = "none";

      console.log("[EKDYS SHIFT] Modèle chargé.");
      console.log("Dimensions :", size);

    } catch (error) {

      loading.textContent =
        "ERREUR MODÈLE : " + error.message;

      console.error(error);

    }

  },

  undefined,

  (error) => {

    loading.textContent =
      "ERREUR GLB : " +
      (error.message || "Impossible de charger le modèle.");

    console.error("[EKDYS SHIFT]", error);

  }
);

// ==========================================
// ROTATION MANUELLE SOURIS / TACTILE
// ==========================================

const canvas = renderer.domElement;

canvas.addEventListener("pointerdown", (event) => {

  if (event.pointerType === "mouse" && event.button !== 0) {
    return;
  }

  dragging = true;

  lastPointerX = event.clientX;
  lastPointerY = event.clientY;

  canvas.setPointerCapture(event.pointerId);

});

canvas.addEventListener("pointermove", (event) => {

  if (!dragging) return;

  const deltaX = event.clientX - lastPointerX;
  const deltaY = event.clientY - lastPointerY;

  lastPointerX = event.clientX;
  lastPointerY = event.clientY;

  manualRotationY += deltaX * 0.009;

  manualRotationX = THREE.MathUtils.clamp(
    manualRotationX + deltaY * 0.007,
    -0.65,
    0.65
  );

});

function stopDragging() {
  dragging = false;
}

canvas.addEventListener("pointerup", stopDragging);
canvas.addEventListener("pointercancel", stopDragging);
canvas.addEventListener("lostpointercapture", stopDragging);

// ==========================================
// RÉCEPTION DU SCROLL CARRD
// ==========================================

window.addEventListener("message", (event) => {

  if (event.origin !== "https://ekdys-shift-3d.invalid") {
    // L'origine réelle est contrôlée ci-dessous.
  }

  if (
    event.data?.type === "EKDYS_SCROLL" &&
    event.source === window.parent
  ) {

    scrollTarget = THREE.MathUtils.clamp(
      Number(event.data.progress) || 0,
      0,
      1
    );

  }

});

// ==========================================
// REDIMENSIONNEMENT
// ==========================================

function resize() {

  const width = container.clientWidth;
  const height = container.clientHeight;

  if (!width || !height) return;

  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  renderer.setSize(width, height);

}

new ResizeObserver(resize).observe(container);

// ==========================================
// ANIMATION
// ==========================================

renderer.setAnimationLoop(() => {

  const time = clock.getElapsedTime();

  // Lissage du scroll
  scrollCurrent +=
    (scrollTarget - scrollCurrent) * 0.075;

  if (shirt) {

    // ACTUALISATION DU VENT
    shirt.traverse((object) => {

      if (!object.isMesh) return;

      const materials = Array.isArray(object.material)
        ? object.material
        : [object.material];

      materials.forEach((material) => {

        const shader = material.userData.windShader;

        if (shader) {
          shader.uniforms.uTime.value = time;
        }

      });

    });

    // ROTATION AUTOMATIQUE + SCROLL
    shirt.rotation.y =
      manualRotationY +
      Math.sin(time * 0.25) * 0.018 +
      scrollCurrent * 0.48;

    shirt.rotation.x =
      manualRotationX +
      scrollCurrent * 0.12;

    shirt.rotation.z =
      Math.sin(time * 0.5) * 0.012 +
      Math.sin(scrollCurrent * Math.PI) * 0.045;

    // DÉPLACEMENT HORIZONTAL
    shirt.position.x =
      baseX +
      Math.sin(scrollCurrent * Math.PI) * 0.16;

    // DÉPLACEMENT VERTICAL
    shirt.position.y =
      baseY +
      Math.sin(time * 0.9) * 0.025 -
      scrollCurrent * 0.12;

    // RAPPROCHEMENT
    const zoom = 1 + scrollCurrent * 0.20;

    shirt.scale.setScalar(baseScale * zoom);

    shirt.position.z =
      baseZ + scrollCurrent * 0.48;

  }

  renderer.render(scene, camera);

});

</script>

</body>
</html>
