<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKDYS — SHIFT 3D</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent;
  border: 0;
}

#shift-scene {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

#shift-background {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: url("./fond-ekdys.png") center / cover no-repeat;
  pointer-events: none;
}

#shift-scene canvas {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none !important;
  touch-action: none;
  user-select: none;
}

#shift-loading {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: grid;
  place-items: center;
  color: #aaa;
  font: 12px Arial, sans-serif;
  letter-spacing: 2px;
  pointer-events: none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="shift-scene">
  <div id="shift-background"></div>
  <div id="shift-loading">EKDYS — LOADING</div>
</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

/* =========================================
   SCÈNE
========================================= */

const container = document.querySelector("#shift-scene");
const loading = document.querySelector("#shift-loading");

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x080808, 0.005);

/* =========================================
   CAMÉRA
========================================= */

const camera = new THREE.PerspectiveCamera(
  32,
  container.clientWidth / container.clientHeight,
  0.01,
  100
);

/* Distance initiale et distance finale */
const CAMERA_Z_FAR = 8.0;
const CAMERA_Z_CLOSE = 6.4;

camera.position.set(0, 0, CAMERA_Z_FAR);

/* =========================================
   RENDERER
========================================= */

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1, 1.5)
);

renderer.setSize(
  container.clientWidth,
  container.clientHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.setClearColor(0x000000, 0);
renderer.domElement.style.pointerEvents = "none";

container.appendChild(renderer.domElement);

/* =========================================
   ÉCLAIRAGE
========================================= */

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x252027,
    1.35
  )
);

const keyLight = new THREE.DirectionalLight(
  0xffffff,
  2.7
);
keyLight.position.set(1.5, 4, 4);
scene.add(keyLight);

const sideLight = new THREE.DirectionalLight(
  0xe8eaf2,
  1.45
);
sideLight.position.set(-4, 1.5, 2);
scene.add(sideLight);

const rimLight = new THREE.DirectionalLight(
  0xb52a42,
  1.1
);
rimLight.position.set(-3, 1, -3);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(
  0xffffff,
  0.8
);
fillLight.position.set(0, -1, 5);
scene.add(fillLight);

/* =========================================
   CHARGEMENT DRACO
========================================= */

const dracoLoader = new DRACOLoader();

dracoLoader.setDecoderPath(
  "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
);

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

/* =========================================
   VARIABLES
========================================= */

const clock = new THREE.Clock();

let shirtPivot = null;
let shirtModel = null;

let baseScale = 1;
let modelSize = new THREE.Vector3();
let modelCenter = new THREE.Vector3();

let scrollTarget = 0;
let scrollCurrent = 0;

const INITIAL_ROTATION_Y = 0.34;
const SCROLL_ROTATION_Y = 0.72;

/* Animation des shaders */
const animatedShaders = [];

/* =========================================
   CADRAGE RESPONSIVE
   Le cadrage est calculé à la distance
   finale, lorsque le T-shirt est rapproché.
========================================= */

function updateShirtFit() {
  if (!shirtPivot || !shirtModel) return;
  if (modelSize.y <= 0) return;

  const width = container.clientWidth;
  const height = container.clientHeight;

  if (!width || !height) return;

  const aspect = width / height;

  const visibleHeight =
    2 *
    Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) *
    CAMERA_Z_CLOSE;

  const visibleWidth = visibleHeight * aspect;

  const rotatedWidth =
    Math.abs(modelSize.x * Math.cos(INITIAL_ROTATION_Y)) +
    Math.abs(modelSize.z * Math.sin(INITIAL_ROTATION_Y));

  const widthMargin = aspect < 0.75 ? 0.88 : 0.90;
  const heightMultiplier = aspect < 0.75 ? 1.12 : 1.20;

  const scaleByWidth =
    (visibleWidth * widthMargin) /
    Math.max(rotatedWidth, 0.001);

  const scaleByHeight =
    (visibleHeight * heightMultiplier) /
    Math.max(modelSize.y, 0.001);

  baseScale = Math.min(scaleByWidth, scaleByHeight);

  shirtPivot.scale.setScalar(baseScale);

  const scaledHeight = modelSize.y * baseScale;
  const bottomAnchor = -visibleHeight * 0.43;

  shirtPivot.position.set(
    0,
    bottomAnchor + scaledHeight / 2,
    0
  );
}

/* =========================================
   CHARGEMENT DU T-SHIRT
========================================= */

loader.load(
  "./shift.glb",

  (gltf) => {
    try {
      shirtModel = gltf.scene;

      const bounds = new THREE.Box3().setFromObject(shirtModel);

      modelSize = bounds.getSize(new THREE.Vector3());
      modelCenter = bounds.getCenter(new THREE.Vector3());

      if (
        !Number.isFinite(modelSize.y) ||
        modelSize.y <= 0 ||
        modelSize.x <= 0
      ) {
        throw new Error("Dimensions du modèle 3D invalides.");
      }

      shirtPivot = new THREE.Group();
      shirtModel.position.copy(modelCenter).negate();

      shirtPivot.add(shirtModel);
      scene.add(shirtPivot);

      shirtPivot.rotation.set(
        0,
        INITIAL_ROTATION_Y,
        0
      );

      shirtModel.traverse((object) => {
        if (!object.isMesh) return;

        object.frustumCulled = false;

        const materials = Array.isArray(object.material)
          ? object.material
          : [object.material];

        materials.forEach((material) => {

          const windUniforms = {
            uTime: { value: 0 },
            uMinY: { value: bounds.min.y },
            uInvHeight: {
              value: 1 / Math.max(modelSize.y, 0.001)
            },
            uHeight: { value: modelSize.y },

            uSaturation: {
              value: window.innerWidth >= 768 ? 2.25 : 1.85
            },

            uContrast: { value: 1.08 }
          };

          material.onBeforeCompile = (shader) => {

            shader.uniforms.uTime = windUniforms.uTime;
            shader.uniforms.uMinY = windUniforms.uMinY;
            shader.uniforms.uInvHeight = windUniforms.uInvHeight;
            shader.uniforms.uHeight = windUniforms.uHeight;
            shader.uniforms.uSaturation = windUniforms.uSaturation;
            shader.uniforms.uContrast = windUniforms.uContrast;

            material.userData.windShader = shader;
            animatedShaders.push(shader);

            shader.vertexShader = shader.vertexShader.replace(
              "#include <common>",
              `#include <common>
              uniform float uTime;
              uniform float uMinY;
              uniform float uInvHeight;
              uniform float uHeight;`
            );

            shader.vertexShader = shader.vertexShader.replace(
              "#include <begin_vertex>",
              `#include <begin_vertex>

              float heightRatio = clamp(
                (position.y - uMinY) * uInvHeight,
                0.0,
                1.0
              );

              float hem = 1.0 - smoothstep(
                0.12, 0.48, heightRatio
              );

              float sides = smoothstep(
                0.25,
                0.85,
                abs(position.x) / max(uHeight * 0.25, 0.001)
              );

              float windWeight = max(hem, sides * 0.45);

              float wave = sin(
                uTime * 1.1 +
                position.y * 3.0 +
                position.x * 2.0
              );

              float wave2 = sin(
                uTime * 0.7 +
                position.y * 1.7 -
                position.x * 2.4
              );

              transformed.x +=
                wave * windWeight * uHeight * 0.0015;

              transformed.z +=
                wave2 * windWeight * uHeight * 0.001;
              `
            );

            shader.fragmentShader = shader.fragmentShader.replace(
              "#include <common>",
              `#include <common>
              uniform float uSaturation;
              uniform float uContrast;`
            );

            shader.fragmentShader = shader.fragmentShader.replace(
              "#include <color_fragment>",
              `#include <color_fragment>

              float luma = dot(
                diffuseColor.rgb,
                vec3(0.2126, 0.7152, 0.0722)
              );

              diffuseColor.rgb = mix(
                vec3(luma),
                diffuseColor.rgb,
                uSaturation
              );

              diffuseColor.rgb = (
                diffuseColor.rgb - vec3(0.5)
              ) * uContrast + vec3(0.5);

              float redDominance = smoothstep(
                0.025,
                0.20,
                diffuseColor.r - max(
                  diffuseColor.g,
                  diffuseColor.b
                )
              );

              diffuseColor.r *= mix(
                1.0,
                1.30,
                redDominance
              );

              diffuseColor.g *= mix(
                1.0,
                0.94,
                redDominance
              );

              diffuseColor.b *= mix(
                1.0,
                0.94,
                redDominance
              );
              `
            );
          };

          material.customProgramCacheKey = () =>
            "ekdys-shift-color-wind-v6";

          material.needsUpdate = true;
        });
      });

      updateShirtFit();

      loading.style.display = "none";

      console.log("EKDYS SHIFT : modèle chargé.");

    } catch (error) {
      loading.textContent = "ERREUR : " + error.message;
      console.error("Erreur modèle :", error);
    }
  },

  (progress) => {
    if (progress.total > 0) {
      loading.textContent =
        "EKDYS — LOADING " +
        Math.round(progress.loaded / progress.total * 100) +
        "%";
    }
  },

  (error) => {
    loading.textContent = "ERREUR DE CHARGEMENT DU MODÈLE 3D";
    console.error("Erreur GLB :", error);
  }
);

/* =========================================
   RÉCEPTION DU SCROLL CARRD
========================================= */

window.addEventListener("message", (event) => {
  if (
    event.source !== window.parent ||
    event.data?.type !== "EKDYS_SCROLL"
  ) {
    return;
  }

  scrollTarget = THREE.MathUtils.clamp(
    Number(event.data.progress) || 0,
    0,
    1
  );
});

/* =========================================
   REDIMENSIONNEMENT
========================================= */

function resize() {
  const width = container.clientWidth;
  const height = container.clientHeight;

  if (!width || !height) return;

  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  renderer.setSize(width, height);

  const saturation = width >= 768 ? 2.25 : 1.85;

  animatedShaders.forEach((shader) => {
    shader.uniforms.uSaturation.value = saturation;
  });

  updateShirtFit();
}

new ResizeObserver(resize).observe(container);
window.addEventListener("resize", resize);

/* =========================================
   ANIMATION
========================================= */

renderer.setAnimationLoop(() => {
  const time = clock.getElapsedTime();

  /* Lissage du scroll */
  scrollCurrent += (scrollTarget - scrollCurrent) * 0.09;

  animatedShaders.forEach((shader) => {
    shader.uniforms.uTime.value = time;
  });

  if (shirtPivot) {

    /* Rotation progressive conservée */
    shirtPivot.rotation.y =
      INITIAL_ROTATION_Y -
      scrollCurrent * SCROLL_ROTATION_Y;

    /*
     * RAPPROCHEMENT :
     * départ éloigné → arrivée proche.
     * La caméra avance progressivement avec le scroll.
     */
    camera.position.z = THREE.MathUtils.lerp(
      CAMERA_Z_FAR,
      CAMERA_Z_CLOSE,
      scrollCurrent
    );
  }

  renderer.render(scene, camera);
});
</script>

</body>
</html>
