
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKDYS — SHIFT 3D</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent;
}

#shift-scene {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

#shift-background {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: url("./fond-ekdys.png") center / cover no-repeat;
  pointer-events: none;
}

#shift-scene canvas {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none !important;
  touch-action: none;
  user-select: none;
}

#shift-loading {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: grid;
  place-items: center;
  color: #aaa;
  font: 12px Arial, sans-serif;
  letter-spacing: 2px;
  pointer-events: none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="shift-scene">
  <div id="shift-background"></div>
  <div id="shift-loading">EKDYS — LOADING</div>
</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

/* =========================================
   SCÈNE
========================================= */

const container = document.querySelector("#shift-scene");
const loading = document.querySelector("#shift-loading");

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x080808, 0.006);

/* =========================================
   CAMÉRA
========================================= */

const INITIAL_CAMERA_Z = 6.4;

const camera = new THREE.PerspectiveCamera(
  32,
  container.clientWidth / container.clientHeight,
  0.01,
  100
);

camera.position.set(0, 0, INITIAL_CAMERA_Z);

/* =========================================
   RENDERER
========================================= */

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.setClearColor(0x000000, 0);
renderer.domElement.style.pointerEvents = "none";

container.appendChild(renderer.domElement);

/* =========================================
   ÉCLAIRAGE
========================================= */

scene.add(
  new THREE.HemisphereLight(0xffffff, 0x252027, 1.55)
);

const keyLight = new THREE.DirectionalLight(0xffffff, 3.3);
keyLight.position.set(1.5, 4, 4);
scene.add(keyLight);

const sideLight = new THREE.DirectionalLight(0xe8eaf2, 1.65);
sideLight.position.set(-4, 1.5, 2);
scene.add(sideLight);

const rimLight = new THREE.DirectionalLight(0xb52a42, 1.15);
rimLight.position.set(-3, 1, -3);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 0.85);
fillLight.position.set(0, -1, 5);
scene.add(fillLight);

/* =========================================
   DRACO
========================================= */

const dracoLoader = new DRACOLoader();

dracoLoader.setDecoderPath(
  "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
);

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

/* =========================================
   VARIABLES
========================================= */

const clock = new THREE.Clock();

let pivot = null;
let model = null;

let baseScale = 1;
let modelSize = new THREE.Vector3();

let scrollTarget = 0;
let scrollCurrent = 0;

/*
  Rotation initiale : environ 24 degrés.
  Rotation supplémentaire au scroll : environ 36 degrés.
*/
const INITIAL_ROTATION_Y = -0.42;
const SCROLL_ROTATION_Y = -0.62;

/* =========================================
   CADRAGE RESPONSIVE
========================================= */

function updateShirtFit() {
  if (!pivot || !model || modelSize.y <= 0) return;

  const width = container.clientWidth;
  const height = container.clientHeight;

  if (!width || !height) return;

  const aspect = width / height;

  const visibleHeight =
    2 *
    Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) *
    INITIAL_CAMERA_Z;

  const visibleWidth = visibleHeight * aspect;

  const rotatedWidth =
    Math.abs(modelSize.x * Math.cos(INITIAL_ROTATION_Y)) +
    Math.abs(modelSize.z * Math.sin(INITIAL_ROTATION_Y));

  /*
    On réserve la largeur pour éviter les coupures latérales.
    La hauteur est volontairement plus généreuse :
    le modèle pourra dépasser par le haut.
  */
  const widthMargin = aspect < 0.75 ? 0.76 : 0.82;
  const heightMargin = 1.08;

  const scaleByHeight =
    (visibleHeight * heightMargin) / modelSize.y;

  const scaleByWidth =
    (visibleWidth * widthMargin) /
    Math.max(rotatedWidth, 0.001);

  baseScale = Math.min(scaleByHeight, scaleByWidth);

  pivot.scale.setScalar(baseScale);

  /*
    Décalage vertical léger vers le haut :
    le haut peut dépasser, le bas reste dans la fenêtre.
  */
  pivot.position.set(
    0,
    visibleHeight * 0.045,
    0
  );
}

/* =========================================
   CHARGEMENT DU MODÈLE
========================================= */

loader.load(
  "./shift.glb",

  (gltf) => {
    try {
      model = gltf.scene;

      const bounds = new THREE.Box3().setFromObject(model);
      const center = bounds.getCenter(new THREE.Vector3());

      modelSize = bounds.getSize(new THREE.Vector3());

      if (
        !Number.isFinite(modelSize.y) ||
        modelSize.y <= 0 ||
        modelSize.x <= 0
      ) {
        throw new Error("Dimensions du modèle 3D invalides.");
      }

      /*
        Pivot indépendant :
        le modèle est centré dans ce pivot.
        Toute la rotation est ensuite appliquée au pivot.
      */
      pivot = new THREE.Group();

      model.position.sub(center);
      pivot.add(model);
      scene.add(pivot);

      /* =====================================
         MATÉRIAUX / COULEURS / VENT
      ===================================== */

      const isDesktop = window.matchMedia(
        "(min-width: 768px)"
      ).matches;

      /*
        Saturation plus forte sur PC.
        Contraste légèrement augmenté sur les deux supports.
      */
      const saturation = isDesktop ? 2.25 : 1.95;
      const contrast = 1.07;

      model.traverse((object) => {
        if (!object.isMesh) return;

        object.frustumCulled = false;

        const materials = Array.isArray(object.material)
          ? object.material
          : [object.material];

        materials.forEach((material) => {

          const windUniforms = {
            uTime: { value: 0 }
          };

          material.onBeforeCompile = (shader) => {

            shader.uniforms.uTime = windUniforms.uTime;
            material.userData.windShader = shader;

            /* Vent très léger */
            shader.vertexShader = shader.vertexShader.replace(
              "#include <common>",
              `#include <common>
              uniform float uTime;`
            );

            shader.vertexShader = shader.vertexShader.replace(
              "#include <begin_vertex>",
              `#include <begin_vertex>

              float wave = sin(
                uTime * 1.1 +
                position.y * 3.0 +
                position.x * 2.0
              );

              float wave2 = sin(
                uTime * 0.7 +
                position.y * 1.7 -
                position.x * 2.4
              );

              float hemWeight = 1.0 - smoothstep(
                0.12, 0.48,
                clamp(position.y / max(${modelSize.y.toFixed(5)}, 0.001) + 0.5, 0.0, 1.0)
              );

              transformed.x += wave * hemWeight * 0.0015;
              transformed.z += wave2 * hemWeight * 0.001;
              `
            );

            /* Saturation + contraste */
            shader.fragmentShader = shader.fragmentShader.replace(
              "#include <color_fragment>",
              `#include <color_fragment>

              float luma = dot(
                diffuseColor.rgb,
                vec3(0.2126, 0.7152, 0.0722)
              );

              diffuseColor.rgb = mix(
                vec3(luma),
                diffuseColor.rgb,
                ${saturation.toFixed(2)}
              );

              diffuseColor.rgb =
                (diffuseColor.rgb - 0.5) * ${contrast.toFixed(2)} + 0.5;

              /*
                Renforcement ciblé du rouge :
                préserve les noirs et les reliefs.
              */
              float redDominance = smoothstep(
                0.015,
                0.16,
                diffuseColor.r - max(
                  diffuseColor.g,
                  diffuseColor.b
                )
              );

              diffuseColor.r *= mix(1.0, 1.42, redDominance);
              diffuseColor.g *= mix(1.0, 0.90, redDominance);
              diffuseColor.b *= mix(1.0, 0.92, redDominance);

              diffuseColor.rgb = clamp(
                diffuseColor.rgb,
                0.0,
                1.0
              );
              `
            );
          };

          material.customProgramCacheKey = () =>
            "ekdys-shift-color-rotation-wind-v6";

          material.needsUpdate = true;
        });
      });

      updateShirtFit();

      /* Orientation initiale immédiatement visible */
      pivot.rotation.set(0, INITIAL_ROTATION_Y, 0);

      loading.style.display = "none";

      console.log("[EKDYS SHIFT] Modèle chargé.");
      console.log("[EKDYS SHIFT] Rotation initiale :", INITIAL_ROTATION_Y);

    } catch (error) {
      loading.textContent = "ERREUR : " + error.message;
      console.error("[EKDYS SHIFT] Erreur modèle :", error);
    }
  },

  (progress) => {
    if (progress.total > 0) {
      loading.textContent =
        "EKDYS — LOADING " +
        Math.round(progress.loaded / progress.total * 100) +
        "%";
    }
  },

  (error) => {
    loading.textContent = "ERREUR DE CHARGEMENT DU MODÈLE 3D";
    console.error("[EKDYS SHIFT] Erreur GLB :", error);
  }
);

/* =========================================
   RÉCEPTION DU SCROLL DE CARRD
========================================= */

window.addEventListener("message", (event) => {
  if (
    event.source !== window.parent ||
    event.origin !== "https://ekdys.fr"
  ) {
    return;
  }

  if (event.data?.type === "EKDYS_SCROLL") {
    const value = Number(event.data.progress);

    if (Number.isFinite(value)) {
      scrollTarget = THREE.MathUtils.clamp(value, 0, 1);
    }
  }
});

/* =========================================
   REDIMENSIONNEMENT
========================================= */

function resize() {
  const width = container.clientWidth;
  const height = container.clientHeight;

  if (!width || !height) return;

  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  renderer.setSize(width, height);

  updateShirtFit();
}

new ResizeObserver(resize).observe(container);

/* =========================================
   ANIMATION
========================================= */

renderer.setAnimationLoop(() => {
  const time = clock.getElapsedTime();

  scrollCurrent += (scrollTarget - scrollCurrent) * 0.09;

  if (pivot) {

    /* Mise à jour du vent */
    if (model) {
      model.traverse((object) => {
        if (!object.isMesh) return;

        const materials = Array.isArray(object.material)
          ? object.material
          : [object.material];

        materials.forEach((material) => {
          const shader = material.userData.windShader;

          if (shader) {
            shader.uniforms.uTime.value = time;
          }
        });
      });
    }

    /*
      Rotation initiale + rotation liée au scroll.
      Le pivot tourne, pas le maillage individuel.
    */
    pivot.rotation.y =
      INITIAL_ROTATION_Y - scrollCurrent * SCROLL_ROTATION_Y;

    pivot.rotation.x = scrollCurrent * 0.025;
    pivot.rotation.z = -scrollCurrent * 0.008;

    /*
      Le scroll privilégie la rotation.
      Le zoom est volontairement réduit.
    */
    const zoom = 1 + scrollCurrent * 0.10;
    pivot.scale.setScalar(baseScale * zoom);

    pivot.position.z = scrollCurrent * 0.06;
  }

  renderer.render(scene, camera);
});
</script>
</body>
</html>
