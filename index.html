
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKDYS — SHIFT 3D</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

#shift-scene {
  width: 100%;
  height: 100%;
  overflow: hidden;
  position: relative;
  background: transparent;
}

#shift-scene canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#shift-loading {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: #aaa;
  font: 12px Arial, sans-serif;
  letter-spacing: 2px;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="shift-scene">
  <div id="shift-loading">EKDYS — LOADING</div>
</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const container = document.querySelector("#shift-scene");
const loading = document.querySelector("#shift-loading");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  32,
  container.clientWidth / container.clientHeight,
  0.01,
  100
);
camera.position.set(0, 0, 4.5);

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

container.appendChild(renderer.domElement);

// Lumière principale
scene.add(new THREE.HemisphereLight(0xffffff, 0x171717, 2));

const keyLight = new THREE.DirectionalLight(0xffffff, 3);
keyLight.position.set(2, 3, 4);
scene.add(keyLight);

// Lumière de contour
const rimLight = new THREE.DirectionalLight(0x9a263b, 1.5);
rimLight.position.set(-3, 1, -2);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 0.7);
fillLight.position.set(-2, -1, 3);
scene.add(fillLight);

const clock = new THREE.Clock();
const loader = new GLTFLoader();

let shirt = null;
let baseScale = 1;
let baseY = 0;
let scrollProgress = 0;

loader.load(
  "./shift.glb",

  (gltf) => {
    shirt = gltf.scene;

    // Calcul automatique des dimensions
    const bounds = new THREE.Box3().setFromObject(shirt);
    const size = bounds.getSize(new THREE.Vector3());
    const center = bounds.getCenter(new THREE.Vector3());

    // Centrage et mise à l'échelle
    baseScale = 2.35 / Math.max(size.y, 0.001);
    shirt.scale.setScalar(baseScale);
    shirt.position.set(
      -center.x * baseScale,
      -center.y * baseScale,
      -center.z * baseScale
    );

    baseY = shirt.position.y;

    // Préparation de l'effet de vent
    shirt.traverse((object) => {
      if (!object.isMesh) return;

      object.frustumCulled = false;

      const materialList = Array.isArray(object.material)
        ? object.material
        : [object.material];

      materialList.forEach((material) => {
        const windUniforms = {
          uTime: { value: 0 },
          uMinY: { value: bounds.min.y },
          uInvHeight: { value: 1 / Math.max(size.y, 0.001) },
          uHeight: { value: size.y }
        };

        material.onBeforeCompile = (shader) => {
          shader.uniforms.uTime = windUniforms.uTime;
          shader.uniforms.uMinY = windUniforms.uMinY;
          shader.uniforms.uInvHeight = windUniforms.uInvHeight;
          shader.uniforms.uHeight = windUniforms.uHeight;
          material.userData.windShader = shader;

          shader.vertexShader = shader.vertexShader.replace(
            "#include <common>",
            `#include <common>
            uniform float uTime;
            uniform float uMinY;
            uniform float uInvHeight;
            uniform float uHeight;`
          );

          shader.vertexShader = shader.vertexShader.replace(
            "#include <begin_vertex>",
            `#include <begin_vertex>

            float heightRatio = clamp(
              (position.y - uMinY) * uInvHeight,
              0.0, 1.0
            );

            // Bas du T-shirt : tissu plus mobile
            float hem = 1.0 - smoothstep(0.12, 0.48, heightRatio);

            // Bords latéraux : légère réaction au vent
            float sides = smoothstep(
              0.25, 0.85,
              abs(position.x) / max(uHeight * 0.25, 0.001)
            );

            float windWeight = max(hem, sides * 0.45);

            float wave = sin(
              uTime * 1.35 +
              position.y * 3.0 +
              position.x * 2.0
            );

            float wave2 = sin(
              uTime * 0.85 +
              position.y * 1.7 -
              position.x * 2.4
            );

            transformed.x += wave * windWeight * uHeight * 0.008;
            transformed.z += wave2 * windWeight * uHeight * 0.006;
            `
          );
        };

        material.customProgramCacheKey = () => "ekdys-shift-wind-v1";
        material.needsUpdate = true;
      });
    });

    scene.add(shirt);
    loading.style.display = "none";
  },

  undefined,

  (error) => {
    loading.textContent = "Impossible de charger shift.glb";
    console.error("Erreur GLB :", error);
  }
);

// Le scroll sera transmis par la page Carrd
window.addEventListener("message", (event) => {
  if (event.data?.type === "EKDYS_SCROLL") {
    scrollProgress = THREE.MathUtils.clamp(
      Number(event.data.progress) || 0,
      0,
      1
    );
  }
});

// Redimensionnement
function resize() {
  const width = container.clientWidth;
  const height = container.clientHeight;

  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  renderer.setSize(width, height);
}

new ResizeObserver(resize).observe(container);

// Animation continue
renderer.setAnimationLoop(() => {
  const time = clock.getElapsedTime();

  if (shirt) {
    shirt.traverse((object) => {
      if (!object.isMesh) return;

      const materials = Array.isArray(object.material)
        ? object.material
        : [object.material];

      materials.forEach((material) => {
        const shader = material.userData.windShader;
        if (shader) shader.uniforms.uTime.value = time;
      });
    });

    // Rotation douce permanente
    shirt.rotation.y =
      Math.sin(time * 0.35) * 0.025 +
      scrollProgress * 0.06;

    shirt.rotation.z = Math.sin(time * 0.5) * 0.008;

    // Flottement global
    shirt.position.y =
      baseY + Math.sin(time * 0.8) * 0.018;

    // Avancée progressive au scroll
    const zoom = 1 + scrollProgress * 0.12;
    shirt.scale.setScalar(baseScale * zoom);
    shirt.position.z = scrollProgress * 0.22;
  }

  renderer.render(scene, camera);
});
</script>
</body>
</html>
