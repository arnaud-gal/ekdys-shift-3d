
<div id="ekdys-shift-frame">
  <iframe
    id="ekdys-shift-iframe"
    src="https://arnaud-gal.github.io/ekdys-shift-3d/"
    title="EKDYS SHIFT 3D"
    scrolling="no"
  ></iframe>
</div>

<style>
#ekdys-shift-frame {
  position: relative;
  width: 100vw;
  max-width: none;
  aspect-ratio: 1200 / 896;
  left: 50%;
  margin-left: -50vw;
  padding: 0;
  overflow: hidden;
  border: 0 !important;
  outline: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

#ekdys-shift-iframe {
  display: block;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  border: 0 !important;
  outline: 0 !important;
  background: transparent;
}
</style>

<script>
(() => {
  const iframe = document.getElementById("ekdys-shift-iframe");
  if (!iframe) return;

  let ticking = false;

  function sendScroll() {
    ticking = false;

    const rect = iframe.getBoundingClientRect();
    const viewport = window.innerHeight;

    const start = viewport * 0.95;
    const end = -rect.height * 0.95;

    let progress = (start - rect.top) / (start - end);
    progress = Math.max(0, Math.min(1, progress));

    iframe.contentWindow.postMessage(
      {
        type: "EKDYS_SCROLL",
        progress
      },
      "https://arnaud-gal.github.io"
    );
  }

  function requestScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(sendScroll);
  }

  window.addEventListener("scroll", requestScroll, { passive: true });
  window.addEventListener("resize", requestScroll);
  iframe.addEventListener("load", requestScroll);

  requestScroll();
})();
</script>
