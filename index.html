
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKDYS — SHIFT 3D</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080707;
}

#shift-scene {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080707;
  isolation: isolate;
}

/* IMAGE DE FOND — COUCHE INDÉPENDANTE */
#shift-background {
  position: absolute;
  inset: 0;
  z-index: 0;
  background-image: url("./fond-ekdys.png");
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
  pointer-events: none;
}

/* CANVAS 3D AU-DESSUS DU FOND */
#shift-scene canvas {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
  touch-action: none;
  cursor: grab;
}

#shift-scene canvas:active {
  cursor: grabbing;
}

#shift-loading {
  position: absolute;
  z-index: 2;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 20px;
  color: #aaa;
  font: 12px Arial, sans-serif;
  letter-spacing: 2px;
  text-align: center;
  pointer-events: none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="shift-scene">
  <div id="shift-background"></div>
  <div id="shift-loading">EKDYS — LOADING</div>
</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

const container = document.querySelector("#shift-scene");
const loading = document.querySelector("#shift-loading");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  32,
  container.clientWidth / container.clientHeight,
  0.01,
  100
);

camera.position.set(0, 0, 4.5);

/* RENDU TRANSPARENT POUR LAISSER PASSER LE FOND HTML */
const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

container.appendChild(renderer.domElement);

/* LUMIÈRES */
scene.add(new THREE.HemisphereLight(0xffffff, 0x171717, 2));

const keyLight = new THREE.DirectionalLight(0xffffff, 3);
keyLight.position.set(2, 3, 4);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x9a263b, 1.5);
rimLight.position.set(-3, 1, -2);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 0.7);
fillLight.position.set(-2, -1, 3);
scene.add(fillLight);

/* CHARGEMENT DRACO */
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath(
  "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
);

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

const clock = new THREE.Clock();

let shirt = null;
let baseScale = 1;
let baseY = 0;

let scrollTarget = 0;
let scrollCurrent = 0;

/* ROTATION MANUELLE */
let dragActive = false;
let previousPointerX = 0;
let previousPointerY = 0;

let manualRotationY = 0;
let manualRotationX = 0;

const canvas = renderer.domElement;

canvas.addEventListener("pointerdown", (event) => {
  dragActive = true;
  previousPointerX = event.clientX;
  previousPointerY = event.clientY;
  canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener("pointermove", (event) => {
  if (!dragActive) return;

  const deltaX = event.clientX - previousPointerX;
  const deltaY = event.clientY - previousPointerY;

  previousPointerX = event.clientX;
  previousPointerY = event.clientY;

  manualRotationY += deltaX * 0.009;
  manualRotationX += deltaY * 0.009;

  manualRotationX = THREE.MathUtils.clamp(
    manualRotationX,
    -0.9,
    0.9
  );
});

function stopDrag() {
  dragActive = false;
}

canvas.addEventListener("pointerup", stopDrag);
canvas.addEventListener("pointercancel", stopDrag);
canvas.addEventListener("lostpointercapture", stopDrag);

/* CHARGEMENT DU T-SHIRT */
loader.load(
  "./shift.glb",

  (gltf) => {
    try {
      shirt = gltf.scene;

      const bounds = new THREE.Box3().setFromObject(shirt);
      const size = bounds.getSize(new THREE.Vector3());
      const center = bounds.getCenter(new THREE.Vector3());

      if (!Number.isFinite(size.y) || size.y <= 0) {
        throw new Error("Dimensions du modèle 3D invalides.");
      }

      baseScale = 2.35 / Math.max(size.y, 0.001);

      shirt.scale.setScalar(baseScale);
      shirt.position.set(
        -center.x * baseScale,
        -center.y * baseScale,
        -center.z * baseScale
      );

      baseY = shirt.position.y;

      /* VENT + ROUGE RENFORCÉ */
      shirt.traverse((object) => {
        if (!object.isMesh) return;

        object.frustumCulled = false;

        const materials = Array.isArray(object.material)
          ? object.material
          : [object.material];

        materials.forEach((material) => {
          const windUniforms = {
            uTime: { value: 0 },
            uMinY: { value: bounds.min.y },
            uInvHeight: {
              value: 1 / Math.max(size.y, 0.001)
            },
            uHeight: { value: size.y }
          };

          material.onBeforeCompile = (shader) => {
            shader.uniforms.uTime = windUniforms.uTime;
            shader.uniforms.uMinY = windUniforms.uMinY;
            shader.uniforms.uInvHeight = windUniforms.uInvHeight;
            shader.uniforms.uHeight = windUniforms.uHeight;

            material.userData.windShader = shader;

            shader.vertexShader = shader.vertexShader.replace(
              "#include <common>",
              `#include <common>
              uniform float uTime;
              uniform float uMinY;
              uniform float uInvHeight;
              uniform float uHeight;`
            );

            shader.vertexShader = shader.vertexShader.replace(
              "#include <begin_vertex>",
              `#include <begin_vertex>

              float heightRatio = clamp(
                (position.y - uMinY) * uInvHeight,
                0.0,
                1.0
              );

              float hem = 1.0 - smoothstep(
                0.12,
                0.48,
                heightRatio
              );

              float sides = smoothstep(
                0.25,
                0.85,
                abs(position.x) /
                max(uHeight * 0.25, 0.001)
              );

              float windWeight = max(
                hem,
                sides * 0.45
              );

              float wave = sin(
                uTime * 1.8 +
                position.y * 3.0 +
                position.x * 2.0
              );

              float wave2 = sin(
                uTime * 1.2 +
                position.y * 1.7 -
                position.x * 2.4
              );

              float wave3 = sin(
                uTime * 1.45 +
                position.x * 3.5 +
                position.y * 2.0
              );

              /* VENT : AMPLITUDE MULTIPLIÉE PAR 5 */
              transformed.x +=
                wave * windWeight * uHeight * 0.040;

              transformed.z +=
                wave2 * windWeight * uHeight * 0.030;

              transformed.y +=
                wave3 * windWeight * uHeight * 0.010;
              `
            );

            /* ROUGE : RENFORCEMENT TRÈS IMPORTANT */
            shader.fragmentShader = shader.fragmentShader.replace(
              "#include <common>",
              `#include <common>`
            );

            shader.fragmentShader = shader.fragmentShader.replace(
              "#include <color_fragment>",
              `#include <color_fragment>

              float redDifference =
                diffuseColor.r -
                max(diffuseColor.g, diffuseColor.b);

              float redMask = smoothstep(
                0.025,
                0.16,
                redDifference
              );

              /* Intensification x5 de la composante rouge */
              diffuseColor.rgb *= mix(
                vec3(1.0),
                vec3(5.0, 0.18, 0.18),
                redMask
              );
              `
            );
          };

          material.customProgramCacheKey = () =>
            "ekdys-shift-wind-red-v5";

          material.needsUpdate = true;
        });
      });

      scene.add(shirt);
      loading.style.display = "none";

      console.log("EKDYS : SHIFT chargé.");
      console.log("Dimensions :", size);

    } catch (error) {
      loading.textContent =
        "ERREUR DE CONFIGURATION : " + error.message;
      console.error(error);
    }
  },

  (progress) => {
    if (progress.total > 0) {
      const percent = Math.round(
        (progress.loaded / progress.total) * 100
      );
      loading.textContent = "EKDYS — LOADING " + percent + "%";
    }
  },

  (error) => {
    loading.textContent =
      "ERREUR DE CHARGEMENT : " +
      (error.message || "Impossible de lire le modèle 3D.");

    console.error("Erreur GLB :", error);
  }
);

/* RÉCEPTION DU DÉFILEMENT DEPUIS CARRD */
window.addEventListener("message", (event) => {
  if (event.source !== window.parent) return;

  if (event.data?.type === "EKDYS_SCROLL") {
    scrollTarget = THREE.MathUtils.clamp(
      Number(event.data.progress) || 0,
      0,
      1
    );
  }
});

/* REDIMENSIONNEMENT */
function resize() {
  const width = container.clientWidth;
  const height = container.clientHeight;

  if (!width || !height) return;

  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  renderer.setSize(width, height);
}

new ResizeObserver(resize).observe(container);

/* ANIMATION */
renderer.setAnimationLoop(() => {
  const time = clock.getElapsedTime();

  scrollCurrent += (scrollTarget - scrollCurrent) * 0.075;

  if (shirt) {
    /* ACTUALISATION DU VENT */
    shirt.traverse((object) => {
      if (!object.isMesh) return;

      const materials = Array.isArray(object.material)
        ? object.material
        : [object.material];

      materials.forEach((material) => {
        const shader = material.userData.windShader;

        if (shader) {
          shader.uniforms.uTime.value = time;
        }
      });
    });

    /* ROTATION AUTOMATIQUE + SCROLL x15 */
    const scrollRotation = scrollCurrent * 0.90;

    const automaticY =
      Math.sin(time * 0.35) * 0.025 +
      scrollRotation;

    const automaticX =
      Math.sin(time * 0.25) * 0.012 +
      scrollCurrent * 0.30;

    /* ROTATION MANUELLE AJOUTÉE */
    shirt.rotation.y = automaticY + manualRotationY;
    shirt.rotation.x = automaticX + manualRotationX;

    shirt.rotation.z =
      Math.sin(time * 0.5) * 0.008 +
      Math.sin(scrollCurrent * Math.PI) * 0.10;

    /* FLOTTEMENT */
    shirt.position.y =
      baseY +
      Math.sin(time * 0.8) * 0.018 -
      scrollCurrent * 0.12;

    /* DÉPLACEMENT LATÉRAL AU SCROLL */
    shirt.position.x =
      Math.sin(scrollCurrent * Math.PI) * 0.25;

    /* ZOOM MODÉRÉ POUR RESTER DANS LE CADRE */
    const zoom = 1 + scrollCurrent * 0.12;
    shirt.scale.setScalar(baseScale * zoom);

    /* AVANCÉE LÉGÈRE */
    shirt.position.z = scrollCurrent * 0.18;
  }

  renderer.render(scene, camera);
});
</script>
</body>
</html>
