
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKDYS — SHIFT 3D</title>

<style>
* { box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent;
  border: 0;
}

#shift-scene {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
}

#shift-background {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: url("./fond-ekdys.png") center / cover no-repeat;
  pointer-events: none;
}

#shift-scene canvas {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
  pointer-events: none !important;
  touch-action: none;
  user-select: none;
}

#shift-loading {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: grid;
  place-items: center;
  color: #aaa;
  font: 12px Arial, sans-serif;
  letter-spacing: 2px;
  pointer-events: none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="shift-scene">
  <div id="shift-background"></div>
  <div id="shift-loading">EKDYS — LOADING</div>
</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

const container = document.querySelector("#shift-scene");
const loading = document.querySelector("#shift-loading");

const scene = new THREE.Scene();

/* BRUME NOIRE TRÈS LÉGÈRE */
scene.fog = new THREE.FogExp2(0x080808, 0.012);

/* CAMÉRA */
const camera = new THREE.PerspectiveCamera(
  32,
  container.clientWidth / container.clientHeight,
  0.01,
  100
);

const initialCameraZ = 5.6;
camera.position.set(0, 0, initialCameraZ);

/* RENDERER */
const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.setClearColor(0x000000, 0);
renderer.domElement.style.pointerEvents = "none";

container.appendChild(renderer.domElement);

/* ÉCLAIRAGE RENFORCÉ */

/* Lumière ambiante pour garder les noirs lisibles */
scene.add(
  new THREE.HemisphereLight(0xffffff, 0x242124, 1.5)
);

/* Lumière principale : hautes lumières sur le tissu */
const keyLight = new THREE.DirectionalLight(0xffffff, 2.7);
keyLight.position.set(1.5, 4, 4);
scene.add(keyLight);

/* Lumière latérale froide pour révéler les reliefs */
const sideLight = new THREE.DirectionalLight(0xd9dce5, 1.15);
sideLight.position.set(-4, 1.5, 2);
scene.add(sideLight);

/* Liseré bordeaux */
const rimLight = new THREE.DirectionalLight(0x8f263b, 0.9);
rimLight.position.set(-3, 1, -3);
scene.add(rimLight);

/* Lumière frontale douce */
const fillLight = new THREE.DirectionalLight(0xffffff, 0.65);
fillLight.position.set(0, -1, 5);
scene.add(fillLight);

/* DRACO */
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath(
  "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
);

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

/* VARIABLES */
const clock = new THREE.Clock();

let shirt = null;
let baseScale = 1;
let baseY = 0;
let scrollTarget = 0;
let scrollCurrent = 0;

/* CHARGEMENT DU MODÈLE */
loader.load(
  "./shift.glb",

  (gltf) => {
    try {
      shirt = gltf.scene;

      const bounds = new THREE.Box3().setFromObject(shirt);
      const size = bounds.getSize(new THREE.Vector3());
      const center = bounds.getCenter(new THREE.Vector3());

      if (!Number.isFinite(size.y) || size.y <= 0) {
        throw new Error("Dimensions du modèle 3D invalides.");
      }

      /*
       * Modèle plus reculé et légèrement réduit.
       * Centrage exact sur les trois axes.
       */
      baseScale = 1.65 / Math.max(size.y, 0.001);
      shirt.scale.setScalar(baseScale);

      shirt.position.set(
        -center.x * baseScale,
        -center.y * baseScale,
        -center.z * baseScale
      );

      baseY = shirt.position.y;

      /* Vent très discret */
      shirt.traverse((object) => {
        if (!object.isMesh) return;

        object.frustumCulled = false;

        const materials = Array.isArray(object.material)
          ? object.material
          : [object.material];

        materials.forEach((material) => {
          const uniforms = {
            uTime: { value: 0 },
            uMinY: { value: bounds.min.y },
            uInvHeight: {
              value: 1 / Math.max(size.y, 0.001)
            },
            uHeight: { value: size.y }
          };

          material.onBeforeCompile = (shader) => {
            shader.uniforms.uTime = uniforms.uTime;
            shader.uniforms.uMinY = uniforms.uMinY;
            shader.uniforms.uInvHeight = uniforms.uInvHeight;
            shader.uniforms.uHeight = uniforms.uHeight;

            material.userData.windShader = shader;

            shader.vertexShader = shader.vertexShader.replace(
              "#include <common>",
              `#include <common>
              uniform float uTime;
              uniform float uMinY;
              uniform float uInvHeight;
              uniform float uHeight;`
            );

            shader.vertexShader = shader.vertexShader.replace(
              "#include <begin_vertex>",
              `#include <begin_vertex>

              float heightRatio = clamp(
                (position.y - uMinY) * uInvHeight,
                0.0,
                1.0
              );

              float hem = 1.0 - smoothstep(
                0.12, 0.48, heightRatio
              );

              float sides = smoothstep(
                0.25, 0.85,
                abs(position.x) / max(uHeight * 0.25, 0.001)
              );

              float weight = max(hem, sides * 0.45);

              float wave = sin(
                uTime * 1.1 +
                position.y * 3.0 +
                position.x * 2.0
              );

              float wave2 = sin(
                uTime * 0.7 +
                position.y * 1.7 -
                position.x * 2.4
              );

              transformed.x += wave * weight * uHeight * 0.002;
              transformed.z += wave2 * weight * uHeight * 0.0015;
              `
            );
          };

          material.customProgramCacheKey = () => "ekdys-shift-wind-v3";
          material.needsUpdate = true;
        });
      });

      scene.add(shirt);
      loading.style.display = "none";

      console.log("EKDYS : SHIFT chargé.");

    } catch (error) {
      loading.textContent = "ERREUR : " + error.message;
      console.error(error);
    }
  },

  (progress) => {
    if (progress.total > 0) {
      loading.textContent =
        "EKDYS — LOADING " +
        Math.round(progress.loaded / progress.total * 100) + "%";
    }
  },

  (error) => {
    loading.textContent = "ERREUR DE CHARGEMENT DU MODÈLE 3D";
    console.error("Erreur GLB :", error);
  }
);

/* RÉCEPTION DU SCROLL CARRD */
window.addEventListener("message", (event) => {
  if (
    event.source === window.parent &&
    event.data?.type === "EKDYS_SCROLL"
  ) {
    scrollTarget = THREE.MathUtils.clamp(
      Number(event.data.progress) || 0,
      0,
      1
    );
  }
});

/* RESPONSIVE */
function resize() {
  const width = container.clientWidth;
  const height = container.clientHeight;

  if (!width || !height) return;

  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height);
}

new ResizeObserver(resize).observe(container);

/* ANIMATION */
renderer.setAnimationLoop(() => {
  const time = clock.getElapsedTime();

  scrollCurrent += (scrollTarget - scrollCurrent) * 0.075;

  if (shirt) {
    shirt.traverse((object) => {
      if (!object.isMesh) return;

      const materials = Array.isArray(object.material)
        ? object.material
        : [object.material];

      materials.forEach((material) => {
        const shader = material.userData.windShader;
        if (shader) shader.uniforms.uTime.value = time;
      });
    });

    /* Rotation très faible au scroll */
    shirt.rotation.set(0, scrollCurrent * 0.003, 0);

    /* Zoom progressif */
    const zoom = 1 + scrollCurrent * 0.55;
    shirt.scale.setScalar(baseScale * zoom);

    /* Avance vers le spectateur */
    shirt.position.z = scrollCurrent * 0.55;
    shirt.position.y = baseY;

    camera.position.z = initialCameraZ - scrollCurrent * 0.25;
  }

  renderer.render(scene, camera);
});
</script>
</body>
</html>
