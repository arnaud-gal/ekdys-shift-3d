
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKDYS — SHIFT 3D</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080707;
}

#shift-scene {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;

  /* IMAGE FIXE EN ARRIÈRE-PLAN */
  background-image: url("./fond-ekdys.png");
  background-position: center center;
  background-size: cover;
  background-repeat: no-repeat;

  touch-action: pan-y;
}

#shift-scene canvas {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  touch-action: pan-y;
  cursor: grab;
}

#shift-scene canvas:active {
  cursor: grabbing;
}

#shift-loading {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: grid;
  place-items: center;
  padding: 20px;
  color: #aaa;
  font: 12px Arial, sans-serif;
  letter-spacing: 2px;
  text-align: center;
  white-space: pre-wrap;
  pointer-events: none;
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>

<body>

<div id="shift-scene">
  <div id="shift-loading">EKDYS — LOADING</div>
</div>

<script type="module">

import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";

// ======================================
// CONFIGURATION
// ======================================

const container = document.querySelector("#shift-scene");
const loading = document.querySelector("#shift-loading");

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  32,
  container.clientWidth / container.clientHeight,
  0.01,
  100
);

camera.position.set(0, 0, 4.5);

// ======================================
// RENDERER
// ======================================

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1, 1.5)
);

renderer.setSize(
  container.clientWidth,
  container.clientHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

renderer.setClearColor(0x000000, 0);

container.appendChild(renderer.domElement);

// ======================================
// ÉCLAIRAGE
// ======================================

scene.add(
  new THREE.HemisphereLight(0xffffff, 0x171717, 2)
);

const keyLight = new THREE.DirectionalLight(0xffffff, 3);
keyLight.position.set(2, 3, 4);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x9a263b, 1.5);
rimLight.position.set(-3, 1, -2);
scene.add(rimLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 0.7);
fillLight.position.set(-2, -1, 3);
scene.add(fillLight);

// ======================================
// CHARGEMENT DRACO
// ======================================

const dracoLoader = new DRACOLoader();

dracoLoader.setDecoderPath(
  "https://www.gstatic.com/draco/versioned/decoders/1.5.7/"
);

const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

// ======================================
// VARIABLES
// ======================================

const clock = new THREE.Clock();

let shirt = null;
let baseScale = 1;
let baseY = 0;

let scrollProgress = 0;

// Rotation manuelle
let manualRotationY = 0;
let manualRotationX = 0;

let dragging = false;
let lastPointerX = 0;
let lastPointerY = 0;

// ======================================
// PRÉPARATION DU VENT ET DES COULEURS
// ======================================

function prepareWindMaterial(originalMaterial, bounds) {

  const material = originalMaterial.clone();

  const size = bounds.getSize(new THREE.Vector3());
  const center = bounds.getCenter(new THREE.Vector3());

  const windUniforms = {
    uTime: { value: 0 },
    uMinY: { value: bounds.min.y },
    uInvHeight: { value: 1 / Math.max(size.y, 0.001) },
    uHeight: { value: size.y },
    uCenterX: { value: center.x },
    uHalfWidth: { value: Math.max(size.x * 0.5, 0.001) }
  };

  material.onBeforeCompile = (shader) => {

    // Uniformes du vent
    Object.assign(shader.uniforms, windUniforms);

    material.userData.windShader = shader;

    // VARIABLES
    shader.vertexShader = shader.vertexShader.replace(
      "#include <common>",
      `#include <common>

      uniform float uTime;
      uniform float uMinY;
      uniform float uInvHeight;
      uniform float uHeight;
      uniform float uCenterX;
      uniform float uHalfWidth;
      `
    );

    // DÉFORMATION DU TISSU
    shader.vertexShader = shader.vertexShader.replace(
      "#include <begin_vertex>",
      `#include <begin_vertex>

      float heightRatio = clamp(
        (position.y - uMinY) * uInvHeight,
        0.0,
        1.0
      );

      // Bas du T-shirt
      float hem = 1.0 - smoothstep(
        0.08,
        0.58,
        heightRatio
      );

      // Bords latéraux
      float edge = smoothstep(
        0.18,
        0.90,
        abs(position.x - uCenterX) / uHalfWidth
      );

      // Mobilité générale
      float windWeight = max(
        hem * 0.95,
        edge * 0.75
      );

      // Rafales irrégulières
      float gust = 0.68 + 0.32 * sin(
        uTime * 0.65 + position.y * 1.4
      );

      // Grande vague
      float wave1 = sin(
        uTime * 1.9 +
        position.y * 4.2 +
        position.x * 3.1
      );

      // Petite vague secondaire
      float wave2 = sin(
        uTime * 2.6 -
        position.y * 2.8 +
        position.x * 4.0
      );

      // Ondulation indépendante
      float wave3 = sin(
        uTime * 1.2 +
        position.x * 2.5 -
        position.y * 3.5
      );

      // Déformation horizontale
      transformed.x +=
        wave1 * windWeight * uHeight * 0.022 * gust;

      // Déformation en profondeur
      transformed.z +=
        wave2 * windWeight * uHeight * 0.018 * gust;

      // Léger mouvement vertical
      transformed.y +=
        wave3 * windWeight * uHeight * 0.004 * gust;
      `
    );

    // ROUGE PLUS FRANC ET PLUS SATURÉ
    shader.fragmentShader = shader.fragmentShader.replace(
      "#include <color_fragment>",
      `#include <color_fragment>

      // Détection des zones dominées par le rouge
      float ekRedDifference =
        diffuseColor.r -
        max(diffuseColor.g, diffuseColor.b);

      float ekRedMask = smoothstep(
        0.025,
        0.14,
        ekRedDifference
      ) * smoothstep(
        0.06,
        0.22,
        diffuseColor.r
      );

      // Augmentation de la saturation
      float ekGray = dot(
        diffuseColor.rgb,
        vec3(0.2126, 0.7152, 0.0722)
      );

      vec3 ekSaturated = mix(
        vec3(ekGray),
        diffuseColor.rgb,
        1.40
      );

      // Renforcement du rouge
      ekSaturated.r *= 1.28;
      ekSaturated.g *= 0.88;
      ekSaturated.b *= 0.88;

      diffuseColor.rgb = mix(
        diffuseColor.rgb,
        ekSaturated,
        ekRedMask
      );
      `
    );

  };

  material.customProgramCacheKey = () =>
    "ekdys-shift-wind-red-v2";

  material.needsUpdate = true;

  return material;
}

// ======================================
// CHARGEMENT DU T-SHIRT
// ======================================

loader.load(
  "./shift.glb",

  (gltf) => {

    try {

      shirt = gltf.scene;

      const bounds = new THREE.Box3().setFromObject(shirt);
      const size = bounds.getSize(new THREE.Vector3());
      const center = bounds.getCenter(new THREE.Vector3());

      if (!Number.isFinite(size.y) || size.y <= 0) {
        throw new Error("Dimensions du modèle invalides.");
      }

      // Taille adaptée à la fenêtre
      baseScale = 2.0 / size.y;

      shirt.scale.setScalar(baseScale);

      shirt.position.set(
        -center.x * baseScale,
        -center.y * baseScale,
        -center.z * baseScale
      );

      baseY = shirt.position.y;

      // Préparation de chaque mesh
      shirt.traverse((object) => {

        if (!object.isMesh) return;

        object.frustumCulled = false;

        object.geometry.computeBoundingBox();

        const meshBounds = object.geometry.boundingBox;

        const originals = Array.isArray(object.material)
          ? object.material
          : [object.material];

        const prepared = originals.map((material) =>
          prepareWindMaterial(material, meshBounds)
        );

        object.material = Array.isArray(object.material)
          ? prepared
          : prepared[0];

      });

      scene.add(shirt);

      loading.style.display = "none";

      console.log("[EKDYS SHIFT] Modèle chargé.");
      console.log("Dimensions :", size);

    } catch (error) {

      loading.textContent =
        "ERREUR MODÈLE : " + error.message;

      console.error(error);

    }

  },

  undefined,

  (error) => {

    loading.textContent =
      "ERREUR GLB : " +
      (error.message || "Impossible de charger le modèle.");

    console.error("[EKDYS SHIFT]", error);

  }
);

// ======================================
// ROTATION MANUELLE
// ======================================

const canvas = renderer.domElement;

canvas.addEventListener("pointerdown", (event) => {

  if (event.pointerType === "mouse" && event.button !== 0) return;

  dragging = true;

  lastPointerX = event.clientX;
  lastPointerY = event.clientY;

  canvas.setPointerCapture(event.pointerId);

});

canvas.addEventListener("pointermove", (event) => {

  if (!dragging) return;

  const deltaX = event.clientX - lastPointerX;
  const deltaY = event.clientY - lastPointerY;

  lastPointerX = event.clientX;
  lastPointerY = event.clientY;

  // Rotation horizontale
  manualRotationY += deltaX * 0.008;

  // Inclinaison verticale
  manualRotationX = THREE.MathUtils.clamp(
    manualRotationX + deltaY * 0.006,
    -0.55,
    0.55
  );

});

function stopDragging() {
  dragging = false;
}

canvas.addEventListener("pointerup", stopDragging);
canvas.addEventListener("pointercancel", stopDragging);
canvas.addEventListener("lostpointercapture", stopDragging);

// ======================================
// SCROLL DEPUIS CARRD
// ======================================

window.addEventListener("message", (event) => {

  if (event.data?.type === "EKDYS_SCROLL") {

    scrollProgress = THREE.MathUtils.clamp(
      Number(event.data.progress) || 0,
      0,
      1
    );

  }

});

// ======================================
// REDIMENSIONNEMENT
// ======================================

function resize() {

  const width = container.clientWidth;
  const height = container.clientHeight;

  if (!width || !height) return;

  camera.aspect = width / height;
  camera.updateProjectionMatrix();

  renderer.setSize(width, height);

}

new ResizeObserver(resize).observe(container);

// ======================================
// ANIMATION
// ======================================

renderer.setAnimationLoop(() => {

  const time = clock.getElapsedTime();

  if (shirt) {

    // Vent sur chaque mesh
    shirt.traverse((object) => {

      if (!object.isMesh) return;

      const materials = Array.isArray(object.material)
        ? object.material
        : [object.material];

      materials.forEach((material) => {

        const shader = material.userData.windShader;

        if (shader) {
          shader.uniforms.uTime.value = time;
        }

      });

    });

    // Rotation automatique discrète
    const idleRotation = Math.sin(time * 0.22) * 0.012;

    shirt.rotation.y =
      manualRotationY +
      idleRotation +
      scrollProgress * 0.20;

    shirt.rotation.x =
      manualRotationX +
      scrollProgress * 0.045;

    shirt.rotation.z =
      Math.sin(time * 0.45) * 0.009;

    // Flottement
    shirt.position.y =
      baseY + Math.sin(time * 0.8) * 0.018;

    // Rapprochement au scroll
    const zoom = 1 + scrollProgress * 0.08;

    shirt.scale.setScalar(baseScale * zoom);

    shirt.position.z =
      scrollProgress * 0.18;

  }

  renderer.render(scene, camera);

});

</script>

</body>
</html>
